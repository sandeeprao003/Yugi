<title>Yugi</title>
<meta name="apple-mobile-web-app-title" content="Yugi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#FBF9F4;
  --paper-raise:#FFFFFF;
  --grid:#E4DECD;
  --ink:#26313A;
  --ink-soft:#5E6971;
  --ink-faint:#8B9298;
  --blue:#3D6EDB;      --blue-soft:#E9EFFC;    --blue-line:#C7D6F6;
  --amber:#C97A1E;     --amber-soft:#FBEEDD;   --amber-line:#F0D6AE;
  --teal:#1C8E76;      --teal-soft:#E1F3EE;    --teal-line:#B9E2D6;
  --good:#2E8F52;      --good-soft:#E4F5EA;
  --bad:#C3453A;       --bad-soft:#FBEAE8;
  --info:#7A5FC9;      --info-soft:#EFEAFB;
  --shadow: 0 1px 2px rgba(38,49,58,.06), 0 6px 16px rgba(38,49,58,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C2126;
    --paper-raise:#242A31;
    --grid:rgba(232,227,214,.09);
    --ink:#ECE7DA;
    --ink-soft:#AAB2B8;
    --ink-faint:#7C848B;
    --blue:#7FA0F2;    --blue-soft:rgba(127,160,242,.14);  --blue-line:rgba(127,160,242,.35);
    --amber:#EDA84F;   --amber-soft:rgba(237,168,79,.14);  --amber-line:rgba(237,168,79,.35);
    --teal:#57C7A9;    --teal-soft:rgba(87,199,169,.14);   --teal-line:rgba(87,199,169,.35);
    --good:#5FC783;    --good-soft:rgba(95,199,131,.14);
    --bad:#E8776B;     --bad-soft:rgba(232,119,107,.14);
    --info:#A98CF0;    --info-soft:rgba(169,140,240,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#1C2126;
  --paper-raise:#242A31;
  --grid:rgba(232,227,214,.09);
  --ink:#ECE7DA;
  --ink-soft:#AAB2B8;
  --ink-faint:#7C848B;
  --blue:#7FA0F2;    --blue-soft:rgba(127,160,242,.14);  --blue-line:rgba(127,160,242,.35);
  --amber:#EDA84F;   --amber-soft:rgba(237,168,79,.14);  --amber-line:rgba(237,168,79,.35);
  --teal:#57C7A9;    --teal-soft:rgba(87,199,169,.14);   --teal-line:rgba(87,199,169,.35);
  --good:#5FC783;    --good-soft:rgba(95,199,131,.14);
  --bad:#E8776B;     --bad-soft:rgba(232,119,107,.14);
  --info:#A98CF0;    --info-soft:rgba(169,140,240,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/32px 100%,
    var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{ font-family:'Fredoka',system-ui,sans-serif; text-wrap:balance; }
.num, .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

#app{ max-width:920px; margin:0 auto; padding:28px 20px 64px; }

.eyebrow{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }

.btn{
  border:none; border-radius:12px; padding:12px 22px; font-weight:600; font-size:15px;
  cursor:pointer; transition:transform .1s ease, box-shadow .15s ease, filter .15s ease;
  font-family:'Fredoka',system-ui,sans-serif;
}
.btn:hover{ filter:brightness(1.04); }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--ink); color:var(--paper); box-shadow:var(--shadow); }
.btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--grid); }
.btn-strand{ color:#fff; box-shadow:var(--shadow); }
.btn:disabled{ opacity:.45; cursor:default; }

/* ---------- Login ---------- */
.login-wrap{ padding-top:6vh; }
.brand{ text-align:center; margin-bottom:40px; }
.brand h1{ font-size:40px; margin:0 0 8px; color:var(--ink); }
.brand .tag{ color:var(--ink-soft); font-size:16px; max-width:480px; margin:0 auto; }
.brand .tag .num{ color:var(--blue); font-weight:600; }
.tabs{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
.tab{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:16px 16px 4px 4px;
  padding:20px 22px; min-width:150px; text-align:center; cursor:pointer; box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.tab:hover{ transform:translateY(-3px); }
.tab .badge{
  width:48px; height:48px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center;
  justify-content:center; font-family:'Fredoka'; font-weight:600; font-size:20px; color:#fff;
}
.avatar-badge{ background:var(--grid) !important; overflow:hidden; }
.avatar-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:14px; max-width:520px; margin:0 auto; }
.avatar-option{
  background:var(--paper-raise); border:2.5px solid var(--grid); border-radius:16px; padding:8px; cursor:pointer;
  transition:transform .12s ease, border-color .12s ease; box-shadow:var(--shadow);
}
.avatar-option:hover{ transform:translateY(-3px); }
.avatar-option.selected{ border-color:var(--blue); }
.avatar-option svg{ display:block; width:100%; height:auto; }
.tab .name{ font-weight:600; font-size:16px; }
.tab .streak{ margin-top:6px; font-size:12px; color:var(--ink-faint); }
.tab-new{ border-style:dashed; color:var(--ink-faint); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
.new-form{ display:flex; gap:8px; margin-top:8px; }
.new-form input{
  font-family:inherit; font-size:15px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--grid);
  background:var(--paper); color:var(--ink); width:150px;
}
.grade-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; max-width:640px; margin:0 auto; }
.grade-btn{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:20px 12px;
  font-family:'Fredoka'; font-weight:600; font-size:20px; color:var(--ink); cursor:pointer; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .12s ease, border-color .12s ease;
}
.grade-btn:hover{ transform:translateY(-3px); border-color:var(--blue); }
.grade-band-label{ font-family:'Inter'; font-weight:500; font-size:11px; color:var(--ink-faint); }

/* ---------- Dashboard ---------- */
.dash-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
.dash-header-left{ display:flex; align-items:center; gap:14px; }
.dash-avatar{ width:56px; height:56px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--grid); }
.dash-avatar svg{ display:block; width:100%; height:100%; }
.dash-header h2{ margin:0; font-size:26px; }
.streak-pill{
  display:inline-flex; align-items:center; gap:6px; background:var(--amber-soft); color:var(--amber);
  padding:6px 14px; border-radius:999px; font-weight:700; font-size:14px;
}
.link-btn{ background:none; border:none; color:var(--ink-faint); text-decoration:underline; cursor:pointer; font-size:14px; font-family:inherit; }

.today-bar{ background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:16px 18px; margin-bottom:22px; box-shadow:var(--shadow); }
.today-bar .row1{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.today-bar .row1 strong{ font-family:'Fredoka'; font-size:15px; }
.dots{ display:flex; gap:8px; }
.dot{ width:34px; height:10px; border-radius:6px; background:var(--grid); }
.dot.on{ background:var(--good); }

.strand-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:26px; }
.strand-card{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:16px; padding:20px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; border-top:5px solid var(--c);
}
.strand-card .icon{ width:38px; height:38px; }
.strand-card h3{ margin:0; font-size:18px; }
.strand-card .sub{ font-size:13px; color:var(--ink-soft); line-height:1.5; min-height:38px; }
.status-pill{ align-self:flex-start; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; }
.status-pill.done{ background:var(--good-soft); color:var(--good); }
.status-pill.todo{ background:var(--c-soft); color:var(--c); }
.acc{ font-size:12px; color:var(--ink-faint); }

.week-strip{ background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
.week-strip h4{ margin:0 0 12px; font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:.03em; }
.week-cols{ display:flex; gap:10px; justify-content:space-between; }
.week-col{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
.week-col .lbl{ font-size:11px; color:var(--ink-faint); }
.week-col .bar{ width:100%; max-width:26px; height:52px; background:var(--grid); border-radius:6px; display:flex; flex-direction:column-reverse; overflow:hidden; }
.week-col .fill{ background:var(--teal); width:100%; }
.week-col.today .lbl{ color:var(--ink); font-weight:700; }

/* ---------- Session ---------- */
.session-top{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-radius:14px; margin-bottom:22px; }
.session-top .timer{ font-size:20px; font-weight:600; }
.session-top .timer.low{ color:var(--bad); }
.progress-track{ height:6px; border-radius:4px; background:rgba(0,0,0,.08); margin-bottom:26px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--c); transition:width .3s ease; }

.problem-card{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:20px; padding:36px 32px;
  box-shadow:var(--shadow); text-align:center; min-height:220px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
}
.problem-card .eyebrow{ color:var(--c); }
.problem-tags{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
.exam-tag{ font-size:11px; font-weight:600; color:var(--ink-faint); background:var(--grid); padding:3px 9px; border-radius:999px; }
.problem-eq{ font-family:'IBM Plex Mono'; font-weight:600; font-size:clamp(24px,5vw,34px); font-variant-numeric:tabular-nums; }
.problem-text{ font-size:19px; line-height:1.55; max-width:56ch; }
.problem-text .num{ font-weight:600; color:var(--c); }

.answer-row{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:6px; }
.answer-input{
  font-family:'IBM Plex Mono'; font-size:20px; padding:12px 16px; border-radius:12px; border:2px solid var(--grid);
  background:var(--paper); color:var(--ink); width:160px; text-align:center;
}
.answer-input:focus{ border-color:var(--c); }
.choice-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
.choice-btn{
  border:2px solid var(--grid); background:var(--paper); color:var(--ink); border-radius:12px;
  padding:12px 20px; font-size:16px; font-weight:600; cursor:pointer; font-family:'Fredoka';
}
.choice-btn:hover{ border-color:var(--c); }
.choice-btn.correct{ background:var(--good-soft); border-color:var(--good); color:var(--good); }
.choice-btn.wrong{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }
.choice-btn.dim{ opacity:.5; }

.feedback{ margin-top:6px; padding:14px 18px; border-radius:12px; font-size:15px; max-width:52ch; }
.feedback.correct{ background:var(--good-soft); color:var(--good); }
.feedback.wrong{ background:var(--bad-soft); color:var(--bad); }
.feedback.assisted{ background:var(--info-soft); color:var(--info); }
.feedback .explain{ color:var(--ink-soft); font-weight:400; margin-top:4px; display:block; }
.assisted-note{ color:var(--info); font-weight:600; display:block; margin-top:6px; font-size:13px; }

.help-row{ margin-top:2px; }
.help-btn{ font-size:13px; padding:8px 16px; }
.help-btn:disabled{ opacity:.6; }
.help-panel{ display:flex; flex-direction:column; gap:8px; max-width:52ch; width:100%; text-align:left; }
.help-panel[hidden]{ display:none; }
.hint-source{ font-size:11px; font-weight:700; background:var(--info); color:var(--paper-raise); padding:2px 7px; border-radius:999px; margin-right:6px; white-space:nowrap; }
.chat-bubble{ padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.5; }
.chat-bubble.chat-claude{ background:var(--info-soft); color:var(--info); align-self:flex-start; max-width:100%; }
.chat-bubble.chat-user{ background:var(--grid); color:var(--ink); align-self:flex-end; max-width:85%; }
.chat-ask-row{ display:flex; gap:8px; }
.chat-ask-row input{ flex:1; min-width:0; font-family:inherit; font-size:14px; padding:9px 12px; border-radius:10px; border:1.5px solid var(--grid); background:var(--paper); color:var(--ink); }
.chat-ask-row input:focus{ border-color:var(--info); }
.chat-ask-row button{ font-size:13px; padding:8px 16px; flex-shrink:0; }
.problem-diagram{ display:flex; justify-content:center; margin:2px 0; }
.problem-diagram svg{ max-width:280px; width:100%; height:auto; }

.score-breakdown{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:2px 0 14px; }
.sb-item{ font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px; }
.sb-correct{ background:var(--good-soft); color:var(--good); }
.sb-assisted{ background:var(--info-soft); color:var(--info); }
.sb-missed{ background:var(--bad-soft); color:var(--bad); }
.summary-actions{ display:flex; gap:12px; justify-content:center; margin-top:26px; flex-wrap:wrap; }

.review-list{ display:flex; flex-direction:column; gap:14px; }
.review-item{
  display:flex; gap:14px; background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px;
  padding:16px 18px; box-shadow:var(--shadow); border-left:4px solid var(--grid);
}
.review-item.correct{ border-left-color:var(--good); }
.review-item.wrong{ border-left-color:var(--bad); }
.review-mark{ font-size:20px; flex-shrink:0; }
.review-body{ flex:1; min-width:0; }
.review-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--c); margin-bottom:6px; }
.review-prompt{ font-size:15px; margin-bottom:8px; }
.review-prompt.mono{ font-family:'IBM Plex Mono'; font-weight:600; }
.review-answers{ display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
.review-your strong{ color:var(--ink); }
.review-correct strong{ color:var(--good); }
.review-explain{ font-size:13px; color:var(--ink-soft); }

.session-actions{ display:flex; justify-content:center; margin-top:22px; }

/* ---------- Summary ---------- */
.summary-card{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:20px; padding:44px 32px;
  box-shadow:var(--shadow); text-align:center;
}
.summary-card .score{ font-family:'IBM Plex Mono'; font-weight:700; font-size:56px; margin:14px 0; }
.summary-card h2{ margin:0; font-size:24px; }
.summary-card p{ color:var(--ink-soft); font-size:15px; }
.day-banner{
  margin-top:22px; padding:16px; border-radius:14px; background:var(--amber-soft); color:var(--amber);
  font-weight:700; font-family:'Fredoka';
}

/* ---------- Roadmap & Progress ---------- */
.phase-line{ font-size:13px; color:var(--ink-faint); margin-top:2px; font-weight:600; }
.persona-card{
  display:flex; align-items:center; gap:18px; background:var(--paper-raise); border:1.5px solid var(--grid);
  border-radius:16px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:22px;
}
.persona-badge{
  width:56px; height:56px; border-radius:50%; background:var(--amber-soft); display:flex; align-items:center;
  justify-content:center; font-size:26px; flex-shrink:0;
}
.persona-title{ font-family:'Fredoka'; font-weight:600; font-size:20px; }
.persona-stats{ font-size:13px; color:var(--ink-soft); margin-top:2px; }

.roadmap{ background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); margin-bottom:22px; }
.roadmap h4{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:.03em; }
.roadmap-track{ display:flex; gap:6px; }
.roadmap-step{ flex:1; text-align:center; padding-top:14px; position:relative; }
.roadmap-step::before{
  content:''; position:absolute; top:4px; left:-50%; width:100%; height:2px; background:var(--grid);
}
.roadmap-step:first-child::before{ display:none; }
.roadmap-step.past::before{ background:var(--good); }
.roadmap-dot{ width:9px; height:9px; border-radius:50%; background:var(--grid); margin:0 auto 8px; position:relative; z-index:1; }
.roadmap-step.past .roadmap-dot{ background:var(--good); }
.roadmap-step.current .roadmap-dot{ background:var(--amber); width:13px; height:13px; box-shadow:0 0 0 4px var(--amber-soft); }
.roadmap-name{ font-size:12px; font-weight:700; font-family:'Fredoka'; }
.roadmap-step.current .roadmap-name{ color:var(--amber); }
.roadmap-weeks{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
.roadmap-current{ margin:16px 0 0; font-size:14px; color:var(--ink-soft); }
.roadmap-disclaimer{ margin:10px 0 0; font-size:12px; color:var(--ink-faint); font-style:italic; }

.sources-card{ background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); margin-bottom:22px; }
.sources-card h4{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:.03em; }
.sources-list{ display:flex; flex-direction:column; gap:12px; }
.source-row{ display:flex; flex-direction:column; gap:2px; padding-bottom:12px; border-bottom:1px solid var(--grid); }
.source-row:last-child{ border-bottom:none; padding-bottom:0; }
.source-name{ font-family:'Fredoka'; font-weight:600; font-size:14px; }
.source-note{ font-size:13px; color:var(--ink-soft); }
.sources-hint{ margin:14px 0 0; font-size:12px; color:var(--ink-faint); }

.past-days-card{ background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); max-height:420px; overflow-y:auto; }
.past-days-card h4{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:.03em; position:sticky; top:0; background:var(--paper-raise); }
.past-day-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--grid); }
.past-day-row:last-child{ border-bottom:none; }
.past-day-label{ font-family:'Fredoka'; font-weight:600; font-size:14px; min-width:52px; flex-shrink:0; }
.past-day-strands{ display:flex; gap:8px; flex-wrap:wrap; flex:1; }
.past-strand-chip{ font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px; background:var(--c-soft, var(--grid)); color:var(--c, var(--ink-soft)); display:inline-flex; align-items:center; gap:4px; }
.past-strand-chip.todo{ background:var(--grid); color:var(--ink-faint); font-weight:500; }
.mini-review-btn{ border:none; background:none; cursor:pointer; font-size:13px; padding:0 0 0 2px; line-height:1; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:20px;
}
.modal-box{
  background:var(--paper-raise); border-radius:16px; padding:28px 26px; max-width:360px; width:100%;
  box-shadow:0 8px 32px rgba(0,0,0,.25); text-align:center;
}
.modal-box h3{ margin:0 0 8px; font-size:19px; }
.modal-box p{ margin:0 0 20px; font-size:14px; color:var(--ink-soft); }
.modal-actions{ display:flex; gap:10px; justify-content:center; }
.modal-input{
  width:100%; font-family:inherit; font-size:16px; padding:10px 14px; border-radius:10px; border:1.5px solid var(--grid);
  background:var(--paper); color:var(--ink); margin-bottom:18px; text-align:center; box-sizing:border-box;
}
.modal-input:focus{ border-color:var(--blue); }

.trend-card{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:16px; padding:18px 20px;
  box-shadow:var(--shadow); border-top:5px solid var(--c);
}
.trend-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
.trend-head h3{ margin:0; font-size:16px; }

<script>
(function(){
"use strict";

/* ============== utilities ============== */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(n){ return n.toLocaleString('en-US'); }
function pad2(n){ return String(n).padStart(2,'0'); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function reduceFrac(n,d){ const g=gcd(n,d); return [n/g, d/g]; }
function fracStr(n,d){ [n,d]=reduceFrac(n,d); if(d===1) return String(n); if(Math.abs(n)>d){ const w=Math.trunc(n/d), r=Math.abs(n%d); return r===0? String(w) : (w+' '+r+'/'+d); } return n+'/'+d; }
function parseFrac(str){
  str=String(str).trim();
  if(str==='') return null;
  let m=str.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if(m){ const w=parseInt(m[1]), n=parseInt(m[2]), d=parseInt(m[3]); if(d===0) return null; const sign=w<0?-1:1; return [w*d+sign*n, d]; }
  m=str.match(/^(-?\d+)\/(\d+)$/);
  if(m){ const n=parseInt(m[1]), d=parseInt(m[2]); if(d===0) return null; return [n,d]; }
  m=str.match(/^-?\.\d+$/) ? str : null;
  if(/^-?\d+(\.\d+)?$/.test(str)){
    if(str.includes('.')){ const dp=str.split('.')[1].length; const d=Math.pow(10,dp); return [Math.round(parseFloat(str)*d), d]; }
    return [parseInt(str),1];
  }
  return null;
}
function fracEq(n1,d1,n2,d2){ return n1*d2 === n2*d1; }
function checkNumber(input, answer, tol){ tol=tol===undefined?1e-6:tol; const v=parseFloat(String(input).trim()); if(Number.isNaN(v)) return false; return Math.abs(v-answer)<tol; }
function answerMatchesFraction(input, n, d){
  input=String(input).trim();
  if(input==='') return false;
  if(/^-?\d*\.\d+$/.test(input)){ const v=parseFloat(input); return Math.abs(v-n/d) < 0.01; }
  const parsed=parseFrac(input);
  if(!parsed) return false;
  return fracEq(parsed[0],parsed[1], n, d);
}
function N(x){ return '<span class="num">'+x+'</span>'; }

const NAMES = ['Maya','Diego','Priya','Sam','Alex','Noah','Zoe','Liam','Ava','Kofi','Ines','Theo'];

/* ============== problem generators ============== */

/* General strategy for each topic — teaches the METHOD, never the specific
   numeric answer to the problem on screen, so a kid can read this and still
   work the problem out themselves. */
const CONCEPT_HELP = {
  placeValue:'Break the number into its place-value columns (ones, tens, hundreds, thousands...). The value of a digit is that digit multiplied by its place’s value.',
  addSub:'Line up the numbers by place value, then add or subtract column by column, regrouping (carrying or borrowing) when a column doesn’t fit in one digit.',

  fracEquivalence:'Multiply (or divide) the top and bottom of a fraction by the same number — that keeps the value the same but changes how it looks.',
  fracAddSub:'When denominators (bottom numbers) match, just add or subtract the numerators (top numbers) and keep the denominator the same.',
  fracMultiply:'Multiplying a whole number by a fraction means multiplying it by the numerator, then keeping the same denominator.',
  decimals:'Decimals are fractions written differently — the first digit after the point is tenths, the second is hundredths. Line up decimal points before adding or comparing.',
  measurement:'Find the conversion factor between the two units (like 12 inches = 1 foot), then multiply or divide by it depending on which direction you’re converting.',
  perimeterArea:'Perimeter is the distance around a shape (add up all the sides). Area is the space inside — for a rectangle, multiply length × width.',

  sumDiffPuzzle:'If you know the sum and difference of two numbers, the larger number is (sum + difference) ÷ 2, and the smaller is the larger minus the difference.',
  fractionWordPuzzle:'Add up all the fractions or parts that were used or eaten, then subtract that total from the whole to find what’s left.',
  fractionOfGroup:'First find what the fraction of the total means as an actual count, then subtract that count from the total to find the rest.',
  patternSquares:'Look at how the count grows from one figure to the next — many growing patterns follow a simple rule like squaring the figure number.',
  combinatoricsCount:'When order matters and nothing repeats, multiply the number of choices for the first pick by the choices left for the second pick.',
  orderOfOps:'Work in this order: parentheses first, then multiplication and division (left to right), then addition and subtraction (left to right).',
  decimalMultDiv:'Multiply or divide as if the decimals weren’t there, then place the decimal point back based on how many decimal places the original numbers had.',
  exponentsBasic:'An exponent tells you how many times to multiply the base by itself. 3^4 means 3 × 3 × 3 × 3.',
  divisibilityCheck:'Each divisor has its own quick test (e.g. divisible by 3 if the digits add to a multiple of 3). When unsure, just try the division.',
  gcfLcmWord:'For "greatest number of identical groups", find the GCF. For "when will two repeating events line up again", find the LCM.',
  primeFactorLargest:'Break the number down by dividing by the smallest primes first (2, 3, 5, 7...) until only primes are left.',
  digitSumCount:'List the two-digit numbers systematically (by tens digit) and check each one’s digit sum — an organized search avoids missing any.',
  ratioSimplify:'Divide both numbers in the ratio by their greatest common factor to reach the simplest form.',
  unitRate:'Divide the total amount by the number of units (like hours) to find the amount per single unit.',
  percentOf:'Turn the percent into a fraction or decimal (25% = 25/100 = 0.25), then multiply by the number.',
  proportionSolve:'Find what number the first fraction’s denominator was multiplied by to reach the second denominator, then multiply the numerator by that same amount.',
  percentWordPuzzle:'Find the discount amount first (percent × price), then subtract it from the original price.',
  ratioWordPuzzle:'Add the parts of the ratio to find the total "ratio units", then figure out how many real items each unit represents.',
  areaTriangle:'The area of a triangle is half of base × height — picture two identical triangles forming a rectangle.',
  volumeRectPrism:'Volume of a rectangular box is length × width × height — how many unit cubes would fill it.',
  coordinateDistance:'If two points share the same x or y coordinate, the distance is just the difference between the other coordinates.',
  meanMedian:'The median is the middle value once the numbers are sorted. The mean is the total of all values divided by how many there are.',

  scientificNotation:'Moving the decimal point right by the exponent’s value is the same as multiplying by 10 that many times.',

  compoundProbability:'For two independent events, multiply the probability of each one happening.',
  statisticsRange:'Subtract the smallest value in the data set from the largest.',
  geometryOlympiadPuzzle:'Work backwards — if you know the area, find the side length first (square root it), then use that to find what’s asked.',
  combinatoricsAdvanced:'Multiply the number of choices for each position, decreasing by one each time an item is used up.',
  quadraticFactoring:'Find two numbers that multiply to the constant term and add to the middle coefficient — those are the roots with the sign flipped.',
  systemsOfEquations:'Multiply one or both equations so a variable’s coefficients match, then add or subtract the equations to eliminate that variable.',
  functionEvaluation:'Substitute the given input for x everywhere it appears in the function, then simplify using order of operations.',
  exponentialGrowth:'Multiply the starting amount by the growth factor once for every time period that passes.',
  polynomialSimplify:'Combine terms with the same variable and exponent by adding their coefficients.',

  systemWordPuzzle:'Translate the word problem into an equation using the given known values, then solve for the unknown.',
  trigRatios:'SOH-CAH-TOA: sine = opposite/hypotenuse, cosine = adjacent/hypotenuse, tangent = opposite/adjacent.',
  distanceMidpointSlope:'Slope = change in y ÷ change in x. Midpoint = average of the x’s and average of the y’s. Distance uses the Pythagorean theorem on the horizontal and vertical legs.',

  trigWordPuzzle:'Draw the right triangle the situation describes, then use the Pythagorean theorem or a trig ratio to solve for the missing side.',
  geometryChallenge:'The sum of interior angles of a polygon is (number of sides − 2) × 180°.',

  seriesSum:'Add the first and last term, multiply by the number of terms, then divide by 2.',
  probabilityCombinatorics:'Divide the number of favorable combinations by the total number of possible combinations.',
  amcStylePuzzle1:'Represent consecutive integers as n, n+1, n+2... and set their sum equal to the given total to solve for n.',
  amcStylePuzzle2:'Turn the digit clues into two equations (sum and difference of the digits), then solve them together.'

function genPlaceValue(){
  const variant = pick(['digitValue','round','compare','expanded']);
  if(variant==='digitValue'){
    const num = randInt(100000,987654);
    const placeNames=['hundred-thousands','ten-thousands','thousands','hundreds','tens','ones'];
    const placeValues=[100000,10000,1000,100,10,1];
    const pos = randInt(0,5);
    const digitsArr = String(num).split('');
    const digit = parseInt(digitsArr[pos]);
    const value = digit*placeValues[pos];
    const highlighted = digitsArr.map((ch,i)=> i===pos ? '<strong>'+ch+'</strong>' : ch).join('');
    return { isEquation:false, prompt:'What is the value of the digit in '+N(highlighted)+' shown in bold?',
      type:'number', answer:value,
      explanation:'The bold digit is in the '+placeNames[pos]+' place, so its value is '+digit+' × '+fmt(placeValues[pos])+' = '+fmt(value)+'.',
      diagram:{type:'placeValueChart', digits:digitsArr, highlightPos:pos} };
  }
  if(variant==='round'){
    const num = randInt(1000,987654);
    const place = pick([10,100,1000,10000]);
    const rounded = Math.round(num/place)*place;
    return { isEquation:false, prompt:'Round '+N(fmt(num))+' to the nearest '+N(fmt(place))+'.',
      type:'number', answer:rounded, explanation:fmt(num)+' rounds to '+fmt(rounded)+'.' };
  }
  if(variant==='compare'){
    let a=randInt(1000,99999), b= Math.random()<0.15 ? a : randInt(1000,99999);
    const symbol = a<b?'<':a>b?'>':'=';
    return { isEquation:true, prompt:fmt(a)+' &nbsp;___&nbsp; '+fmt(b),
      type:'choice', choices:shuffle(['<','>','=']), answer:symbol,
      explanation:fmt(a)+' '+symbol+' '+fmt(b)+'.' };
  }
  // expanded
  const parts=[]; let sum=0;
  const places=[100000,10000,1000,100,10,1];
  places.forEach(p=>{ if(Math.random()<0.75 || p===1){ const d=randInt(1,9); parts.push(d*p); sum+=d*p; } });
  if(parts.length<2){ parts.push(4*10); sum+=40; }
  return { isEquation:false, prompt:'What number is '+N(parts.map(fmt).join(' + '))+'?',
    type:'number', answer:sum, explanation:parts.map(fmt).join(' + ')+' = '+fmt(sum)+'.' };
}

function genAddSub(){
  const op = pick(['add','sub']);
  const asWord = Math.random()<0.5;
  if(!asWord){
    if(op==='add'){ const a=randInt(1000,89999), b=randInt(1000,89999); return { isEquation:true, prompt:fmt(a)+' + '+fmt(b)+' = ?', type:'number', answer:a+b, explanation:fmt(a)+' + '+fmt(b)+' = '+fmt(a+b)+'.' }; }
    const a=randInt(2000,99999), b=randInt(1000,a-1); return { isEquation:true, prompt:fmt(a)+' - '+fmt(b)+' = ?', type:'number', answer:a-b, explanation:fmt(a)+' - '+fmt(b)+' = '+fmt(a-b)+'.' };
  }
  const n1=pick(NAMES), n2=pick(NAMES.filter(n=>n!==n1)), item=pick(ITEMS);
  if(op==='add'){
    const a=randInt(120,4800), b=randInt(90,4800);
    return { isEquation:false, prompt:n1+' collected '+N(fmt(a))+' '+item+' and '+n2+' collected '+N(fmt(b))+' more '+item+'. How many '+item+' did they collect in total?',
      type:'number', answer:a+b, explanation:fmt(a)+' + '+fmt(b)+' = '+fmt(a+b)+'.' };
  }
  const a=randInt(500,5000), b=randInt(100,a-1);
  return { isEquation:false, prompt:n1+' had '+N(fmt(a))+' '+item+'. '+n1+' gave away '+N(fmt(b))+' '+item+'. How many '+item+' does '+n1+' have left?',
    type:'number', answer:a-b, explanation:fmt(a)+' - '+fmt(b)+' = '+fmt(a-b)+'.' };
}

function genMultiplication(){
  const variant = pick(['basic2x1','basic3x1','twoByTwo','comparison']);
  if(variant==='basic2x1'){ const a=randInt(10,99), b=randInt(2,9); return { isEquation:true, prompt:a+' × '+b+' = ?', type:'number', answer:a*b, explanation:a+' × '+b+' = '+(a*b)+'.' }; }
  if(variant==='basic3x1'){ const a=randInt(100,999), b=randInt(2,9); return { isEquation:true, prompt:a+' × '+b+' = ?', type:'number', answer:a*b, explanation:a+' × '+b+' = '+fmt(a*b)+'.' }; }
  if(variant==='twoByTwo'){ const a=randInt(11,79), b=randInt(11,49); return { isEquation:true, prompt:a+' × '+b+' = ?', type:'number', answer:a*b, explanation:a+' × '+b+' = '+fmt(a*b)+'.' }; }
  const n1=pick(NAMES), n2=pick(NAMES.filter(n=>n!==n1)), item=pick(ITEMS);
  const base=randInt(3,9), factor=randInt(2,6);
  return { isEquation:false, prompt:n1+' has '+N(factor)+' times as many '+item+' as '+n2+'. '+n2+' has '+N(base)+' '+item+'. How many '+item+' does '+n1+' have?',
    type:'number', answer:base*factor, explanation:base+' × '+factor+' = '+(base*factor)+'.' };
}

function genDivision(){
  const variant = pick(['exact','remainder']);
  if(variant==='exact'){ const divisor=randInt(2,9), quotient=randInt(11,199), dividend=divisor*quotient;
    return { isEquation:true, prompt:fmt(dividend)+' ÷ '+divisor+' = ?', type:'number', answer:quotient, explanation:fmt(dividend)+' ÷ '+divisor+' = '+quotient+'.' }; }
  const divisor=randInt(2,9), quotient=randInt(5,99), remainder=randInt(1,divisor-1), dividend=divisor*quotient+remainder;
  return { isEquation:false, prompt:'What is the remainder when '+N(fmt(dividend))+' is divided by '+N(divisor)+'?',
    type:'number', answer:remainder, explanation:fmt(dividend)+' ÷ '+divisor+' = '+quotient+' remainder '+remainder+'.' };
}

function genFactorsMultiples(){
  const variant = pick(['primeComposite','gcf','lcm','listFactors']);
  function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++){ if(n%i===0) return false; } return true; }
  function factorsOf(n){ const f=[]; for(let i=1;i<=n;i++){ if(n%i===0) f.push(i); } return f; }
  if(variant==='primeComposite'){ const n=randInt(2,60); const ans = isPrime(n) ? 'Prime' : 'Composite';
    return { isEquation:false, prompt:'Is '+N(n)+' prime or composite?', type:'choice', choices:shuffle(['Prime','Composite']), answer:ans,
      explanation: ans==='Prime' ? n+' has only two factors: 1 and '+n+'.' : n+' has factors besides 1 and itself: '+factorsOf(n).join(', ')+'.' }; }
  if(variant==='gcf'){ const a=randInt(6,48), b=randInt(6,48); const g=gcd(a,b);
    return { isEquation:false, prompt:'What is the greatest common factor of '+N(a)+' and '+N(b)+'?', type:'number', answer:g, explanation:'The largest number that divides both '+a+' and '+b+' evenly is '+g+'.' }; }
  if(variant==='lcm'){ const a=randInt(2,12), b=randInt(2,12); const l=(a*b)/gcd(a,b);
    return { isEquation:false, prompt:'What is the least common multiple of '+N(a)+' and '+N(b)+'?', type:'number', answer:l, explanation:'The smallest number that is a multiple of both '+a+' and '+b+' is '+l+'.' }; }
  const n=randInt(12,48); const f=factorsOf(n);
  return { isEquation:false, prompt:'How many factors does '+N(n)+' have (including 1 and '+n+')?', type:'number', answer:f.length, explanation:'The factors of '+n+' are '+f.join(', ')+' — that is '+f.length+' factors.' };
}

function genFracEquivalence(){
  const variant = pick(['missing','compare','simplify']);
  if(variant==='missing'){ const d1=randInt(2,9), mult=randInt(2,6), n1=randInt(1,d1-1), d2=d1*mult, n2=n1*mult;
    const askNumerator = Math.random()<0.7;
    if(askNumerator){ return { isEquation:true, prompt:n1+'/'+d1+' = ?/'+d2, type:'number', answer:n2, explanation:n1+'/'+d1+' × '+mult+'/'+mult+' = '+n2+'/'+d2+'.', diagram:{type:'fractionBar', d:d1, shaded:[n1]} }; }
    return { isEquation:true, prompt:n1+'/'+d1+' = '+n2+'/?', type:'number', answer:d2, explanation:n1+'/'+d1+' × '+mult+'/'+mult+' = '+n2+'/'+d2+'.', diagram:{type:'fractionBar', d:d1, shaded:[n1]} }; }
  if(variant==='compare'){ const d1=randInt(2,12), d2=randInt(2,12), n1=randInt(1,d1-1), n2=randInt(1,d2-1);
    const cross1=n1*d2, cross2=n2*d1; const symbol = cross1<cross2?'<':cross1>cross2?'>':'=';

/* Day N stays the active day until every one of its sessions is finished —
   no matter how much real time passes — so a day is never lost, and the
   next day unlocks the instant the current one is complete. Week/phase in
   the Olympiad syllabus are driven by how many days have actually been
   completed, not by calendar time elapsed. */
function currentWeekNumber(data){ return Math.max(1, Math.ceil((data.currentDay||1)/7)); }
function currentPhaseIndex(data){ const w=currentWeekNumber(data); if(w<=4) return 0; if(w<=8) return 1; if(w<=12) return 2; return 3; }

function loadProfiles(){ try{ return JSON.parse(localStorage.getItem('cto_profiles')||'[]'); }catch(e){ return []; } }
function saveProfiles(list){ localStorage.setItem('cto_profiles', JSON.stringify(list)); }
function defaultData(){ return { days:{}, topicStats:{}, currentDay:1, band:null }; }
function loadData(id){
  try{
    const raw=localStorage.getItem('cto_data_'+id);
    const data = raw? JSON.parse(raw) : defaultData();
    if(!data.days) data.days = {};
    if(!data.currentDay) data.currentDay = 1;
    if(!data.topicStats) data.topicStats = {};
    return data;
  }catch(e){ return defaultData(); }
}
function saveData(id,data){ localStorage.setItem('cto_data_'+id, JSON.stringify(data)); }
/* Resets day-tracking if the learner's grade band changed (their old days'
   strand keys wouldn't match the new package) — topicStats is kept either way. */
function ensureBand(data, band){
  if(data.band !== band){ data.days = {}; data.currentDay = 1; data.band = band; }
}
function ensureDay(data, band, dayNum){
  if(!data.days[dayNum]){
    const day={}; Object.keys(strandsFor(band)).forEach(k=>{ day[k]={done:false}; });
    data.days[dayNum]=day;
  }
  return data.days[dayNum];
}
function allDone(day, band){ if(!day) return false; return Object.keys(strandsFor(band)).every(k=> day[k] && day[k].done); }
function computeStreak(data, band){ let count=0, d=1; while(data.days[d] && allDone(data.days[d], band)){ count++; d++; } return count; }
/* Keeps score/done/assisted forever (tiny), but only keeps the heavier
   per-problem review text for the most recent N completed days. */
function pruneOldReviews(data, keepLastN){
  const dayNums = Object.keys(data.days).map(Number).sort((a,b)=>a-b);
  const cutoff = dayNums.length - keepLastN;
  if(cutoff<=0) return;
  dayNums.slice(0, cutoff).forEach(d=>{
    Object.keys(data.days[d]).forEach(k=>{ if(data.days[d][k] && data.days[d][k].review) delete data.days[d][k].review; });
  });
}

/* ============== persona & progress trends ============== */
function subtopicTrend(stats){
  if(!stats || stats.attempted<6) return null;
  const log = stats.log||[]; if(log.length<6) return null;
  const half = Math.floor(log.length/2);
  const older = log.slice(0,half), recent = log.slice(half);
  const oldAcc = older.reduce((a,b)=>a+b,0)/older.length;
  const newAcc = recent.reduce((a,b)=>a+b,0)/recent.length;
  const diff = newAcc-oldAcc;
  if(diff>0.12) return 'up';
  if(diff<-0.12) return 'down';
  return 'flat';
}
function masteryTier(stats){
  if(!stats || stats.attempted<5) return {label:'Just starting', tone:'new'};
  const acc = stats.correct/stats.attempted;
  if(acc>=0.85) return {label:'Mastered', tone:'good'};
  if(acc>=0.65) return {label:'Developing', tone:'mid'};
  return {label:'Needs practice', tone:'low'};
}

  const strands = strandsFor(band);
  const subtopics = Object.values(strands).flatMap(s=>s.subtopics.concat(s.advanced||[]));
  let mastered=0, totalAttempted=0, totalCorrect=0;
  subtopics.forEach(st=>{ const s=data.topicStats[st]; if(s){ totalAttempted+=s.attempted; totalCorrect+=s.correct; if(s.attempted>=5 && s.correct/s.attempted>=0.85) mastered++; } });
  let title;
  if(totalAttempted<10) title='Rookie';
  else if(mastered<=2) title='Bronze Olympian';
  else if(mastered<=6) title='Silver Olympian';
  else if(mastered<=11) title='Gold Olympian';
  else title='Olympiad Champion';
  const overallAcc = totalAttempted>0 ? Math.round(100*totalCorrect/totalAttempted) : null;
  return { title, mastered, totalAttempted, overallAcc, totalTopics:subtopics.length };
}
function strandRating(data, strand){
  const subs = strand.subtopics.concat(strand.advanced||[]);
  let correct=0, attempted=0;
  subs.forEach(st=>{ const s=data.topicStats[st]; if(s){ correct+=s.correct; attempted+=s.attempted; } });
  if(attempted<5) return {label:'New', acc:null};
  const acc = Math.round(100*correct/attempted);
  const label = acc>=85?'Gold':acc>=65?'Silver':'Bronze';
  return {label, acc};
}
function strandSessionSeries(data, strandKey, limit){
  limit = limit||8;
  const dayNums = Object.keys(data.days).map(Number).filter(d=>data.days[d][strandKey] && data.days[d][strandKey].done).sort((a,b)=>a-b);
  return dayNums.slice(-limit).map(d=>({ day:d, pct: Math.round(100*data.days[d][strandKey].score/data.days[d][strandKey].total) }));
}
function trendLabel(series){
  if(series.length<2) return {text:'Not enough sessions yet', tone:'flat'};
  const half = Math.floor(series.length/2);
  const firstAvg = series.slice(0,half).reduce((a,p)=>a+p.pct,0)/half;
  const secondAvg = series.slice(half).reduce((a,p)=>a+p.pct,0)/(series.length-half);
  const diff = Math.round(secondAvg-firstAvg);
  if(diff>=5) return {text:'▲ +'+diff+' pts — improving', tone:'up'};
  if(diff<=-5) return {text:'▼ '+diff+' pts — dip', tone:'down'};
  return {text:'– holding steady', tone:'flat'};
}
function sparklineSvg(series, colorVar){
  if(series.length===0) return '<div style="font-size:13px;color:var(--ink-faint);padding:22px 0;">No completed sessions yet.</div>';
  const w=240, h=64, pad=8;
  const pts = series.map((p,i)=>{
    const x = series.length===1 ? w/2 : pad + (i/(series.length-1))*(w-2*pad);
    const y = pad + (1-p.pct/100)*(h-2*pad);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="overflow:visible;">'
    + '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--grid)" stroke-width="1"/>'
    + '<path d="'+path+'" fill="none" stroke="'+colorVar+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    + pts.map((p,i)=> i===pts.length-1 ? '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+colorVar+'"/>' : '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2" fill="'+colorVar+'" opacity="0.5"/>').join('')
    + '</svg>';
}

/* ============== problem diagrams ==============
   Schematic (not-to-scale) SVGs built from each problem's OWN given values.
   They only ever show information already stated in the prompt — never the
   answer being solved for — so they support the problem without spoiling it. */
function svgOpen(vb, h){ return '<svg viewBox="'+vb+'" width="100%" height="'+(h||140)+'" style="overflow:visible;">'; }
function svgTxt(x,y,txt,opts){
  opts=opts||{};
  return '<text x="'+x+'" y="'+y+'" font-size="'+(opts.size||14)+'" text-anchor="'+(opts.anchor||'middle')+'" '
    +'fill="'+(opts.color||'var(--ink)')+'" font-family="'+(opts.mono===false?"'Fredoka'":"'IBM Plex Mono'")+'" font-weight="600">'+esc(String(txt))+'</text>';
}

function diagRectDims(spec){
  const bx=40, by=24, bw=150, bh=76;
  let extra = spec.depth!==undefined ? svgTxt(bx+bw/2, by+bh+34, 'depth: '+spec.depth, {size:12, color:'var(--ink-faint)', mono:false}) : '';
  return svgOpen('0 0 230 150', 150)
    + '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5" rx="3"/>'
    + svgTxt(bx+bw/2, by-8, spec.w, {size:14})
    + svgTxt(bx-10, by+bh/2+5, spec.h, {size:14, anchor:'end'})
    + extra
    + '</svg>';
}
function diagRightTriangle(spec){
  const x0=30,y0=110, x1=190,y1=110, x2=30,y2=20;
  const labelA = spec.unknown==='a' ? '?' : spec.a;
  const labelB = spec.unknown==='b' ? '?' : spec.b;
  const labelC = spec.unknown==='c' ? '?' : spec.c;
  return svgOpen('0 0 220 140', 140)
    + '<polygon points="'+x0+','+y0+' '+x1+','+y1+' '+x2+','+y2+'" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round"/>'
    + '<rect x="'+x0+'" y="'+(y0-14)+'" width="14" height="14" fill="none" stroke="var(--c)" stroke-width="1.5"/>'
    + svgTxt((x0+x1)/2, y0+22, labelB, {size:14})
    + svgTxt(x0-12, (y0+y2)/2+5, labelA, {size:14, anchor:'end'})
    + svgTxt((x1+x2)/2+18, (y1+y2)/2-8, labelC, {size:14})
    + '</svg>';
}
function diagCircle(spec){
  const cx=110, cy=75, r=55;
  let inner = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5"/>';
  if(spec.arcs){
    for(let i=0;i<spec.arcs;i++){
      const ang = (i/spec.arcs)*2*Math.PI - Math.PI/2;
      const px = cx+r*Math.cos(ang), py = cy+r*Math.sin(ang);
      inner += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.5" fill="var(--c)"/>';
    }
  } else {
    inner += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" stroke="var(--c)" stroke-width="2"/>'
      + svgTxt(cx+r/2, cy-8, spec.r, {size:13});
  }
  return svgOpen('0 0 220 150', 150) + inner + '</svg>';
}
function diagAngle(spec){
  const ox=40, oy=120, len=150;
  const rad = spec.deg*Math.PI/180;
  const x2 = ox+len*Math.cos(-rad), y2 = oy+len*Math.sin(-rad);
  const arcR = 34;
  const largeArc = spec.deg>180?1:0;
  const ax = ox+arcR, ay=oy;
  const bx = ox+arcR*Math.cos(-rad), by = oy+arcR*Math.sin(-rad);
  return svgOpen('0 0 220 140', 140)
    + '<line x1="'+ox+'" y1="'+oy+'" x2="'+(ox+len)+'" y2="'+oy+'" stroke="var(--c)" stroke-width="2.5"/>'
    + '<line x1="'+ox+'" y1="'+oy+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--c)" stroke-width="2.5"/>'
    + '<path d="M '+ax.toFixed(1)+' '+ay.toFixed(1)+' A '+arcR+' '+arcR+' 0 '+largeArc+' 0 '+bx.toFixed(1)+' '+by.toFixed(1)+'" fill="none" stroke="var(--c)" stroke-width="1.5"/>'
    + '</svg>';
}
function diagPolygon(spec){
  const cx=110, cy=75, r=55, n=spec.sides||4;
  let pts=[];
  for(let i=0;i<n;i++){ const ang=(i/n)*2*Math.PI - Math.PI/2; pts.push((cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1)); }
  return svgOpen('0 0 220 150', 150)
    + '<polygon points="'+pts.join(' ')+'" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round"/>'
    + '</svg>';
}
function diagFractionBar(spec){
  const d=spec.d, W=220, H=44, x0=10, y0=20, cw=(W-2*x0)/d;
  const colors = spec.colors || ['var(--c)'];
  let rects='';
  let filled=0;
  (spec.shaded||[]).forEach((n,gi)=>{
    for(let i=0;i<n;i++){
      rects += '<rect x="'+(x0+(filled+i)*cw).toFixed(1)+'" y="'+y0+'" width="'+cw.toFixed(1)+'" height="'+H+'" fill="'+(colors[gi]||colors[0])+'" opacity="'+(gi===0?1:0.55)+'"/>';
    }
    filled+=n;
  });
  let cells='';
  for(let i=0;i<=d;i++){ cells += '<line x1="'+(x0+i*cw).toFixed(1)+'" y1="'+y0+'" x2="'+(x0+i*cw).toFixed(1)+'" y2="'+(y0+H)+'" stroke="var(--ink)" stroke-width="1" opacity="0.35"/>'; }
  return svgOpen('0 0 '+W+' 80', 80)
    + '<rect x="'+x0+'" y="'+y0+'" width="'+(W-2*x0)+'" height="'+H+'" fill="none" stroke="var(--c)" stroke-width="2"/>'
    + rects + cells
    + '</svg>';
}
function diagPercentBar(spec){
  const W=220, H=34, x0=10, y0=14, pct=spec.pct;
  return svgOpen('0 0 '+W+' 70', 70)
    + '<rect x="'+x0+'" y="'+y0+'" width="'+(W-2*x0)+'" height="'+H+'" fill="none" stroke="var(--c)" stroke-width="2"/>'
    + '<rect x="'+x0+'" y="'+y0+'" width="'+((W-2*x0)*pct/100).toFixed(1)+'" height="'+H+'" fill="var(--c-soft)"/>'
    + svgTxt(x0+2, y0+H+18, '0%', {size:11, anchor:'start', color:'var(--ink-faint)'})
    + svgTxt(x0+W-2*x0-2, y0+H+18, '100%', {size:11, anchor:'end', color:'var(--ink-faint)'})
    + svgTxt(x0+(W-2*x0)*pct/100, y0+H/2+5, pct+'%', {size:13, color:'var(--c)'})
    + '</svg>';
}
function diagNumberLineDots(spec){
  const vals=spec.values, min=Math.min(...vals,spec.min!==undefined?spec.min:vals[0]), max=Math.max(...vals,spec.max!==undefined?spec.max:vals[vals.length-1]);
  const W=240, x0=16, x1=224, y=70;
  const range = (max-min)||1;
  const xOf = v => x0 + ((v-min)/range)*(x1-x0);
  let dots = vals.map(v=>'<circle cx="'+xOf(v).toFixed(1)+'" cy="'+y+'" r="5" fill="var(--c)"/>').join('');
  return svgOpen('0 0 240 100', 100)
    + '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--ink-faint)" stroke-width="1.5"/>'
    + dots
    + svgTxt(x0, y+24, min, {size:11, anchor:'start', color:'var(--ink-faint)'})
    + svgTxt(x1, y+24, max, {size:11, anchor:'end', color:'var(--ink-faint)'})
    + '</svg>';
}
function diagSignedJump(spec){
  const start=spec.start, delta=spec.delta;
  const span = Math.max(Math.abs(start), Math.abs(start+delta), 5)*1.3;
  const x0=16, x1=224, y=60, min=-span, max=span;
  const xOf = v => x0 + ((v-min)/(max-min))*(x1-x0);
  const sx = xOf(start), ex = xOf(start+delta);
  return svgOpen('0 0 240 100', 100)
    + '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--ink-faint)" stroke-width="1.5"/>'
    + '<line x1="'+x0+'" y1="'+y+'" x2="'+x0+'" y2="'+(y-4)+'" stroke="var(--ink-faint)"/>'
    + '<circle cx="'+sx.toFixed(1)+'" cy="'+y+'" r="5" fill="var(--c)"/>'
    + svgTxt(sx, y-14, start, {size:12})
    + '<path d="M '+sx.toFixed(1)+' '+(y-24)+' Q '+((sx+ex)/2).toFixed(1)+' '+(y-46)+' '+ex.toFixed(1)+' '+(y-24)+'" fill="none" stroke="var(--info)" stroke-width="2" marker-end="url(#arrow)"/>'
    + '<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--info)"/></marker></defs>'
    + svgTxt(ex, y+20, '?', {size:14, color:'var(--info)'})
    + '</svg>';
}
function diagCoordPoints(spec){
  const pts=spec.points, W=220,H=140, pad=20;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minX=Math.min(...xs,0)-2, maxX=Math.max(...xs,0)+2, minY=Math.min(...ys,0)-2, maxY=Math.max(...ys,0)+2;
  const xOf = x => pad + ((x-minX)/(maxX-minX))*(W-2*pad);
  const yOf = y => H-pad - ((y-minY)/(maxY-minY))*(H-2*pad);
  const zx = xOf(0), zy = yOf(0);
  let inner = '<line x1="'+pad+'" y1="'+zy.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+zy.toFixed(1)+'" stroke="var(--grid)" stroke-width="1.5"/>'
    + '<line x1="'+zx.toFixed(1)+'" y1="'+pad+'" x2="'+zx.toFixed(1)+'" y2="'+(H-pad)+'" stroke="var(--grid)" stroke-width="1.5"/>';
  if(spec.connect && pts.length>1){ inner += '<line x1="'+xOf(pts[0][0]).toFixed(1)+'" y1="'+yOf(pts[0][1]).toFixed(1)+'" x2="'+xOf(pts[1][0]).toFixed(1)+'" y2="'+yOf(pts[1][1]).toFixed(1)+'" stroke="var(--c)" stroke-width="2.5"/>'; }
  pts.forEach(p=>{ inner += '<circle cx="'+xOf(p[0]).toFixed(1)+'" cy="'+yOf(p[1]).toFixed(1)+'" r="5" fill="var(--c)"/>'
    + svgTxt(xOf(p[0]), yOf(p[1])-10, '('+p[0]+', '+p[1]+')', {size:11, mono:true}); });
  return svgOpen('0 0 '+W+' '+H, H) + inner + '</svg>';
}
function diagPlaceValueChart(spec){
  const digits=spec.digits, n=digits.length, W=220, cw=(W-20)/n, y0=30, h=50;
  let inner='';
  digits.forEach((d,i)=>{
    const x=10+i*cw, isHi = i===spec.highlightPos;
    inner += '<rect x="'+x.toFixed(1)+'" y="'+y0+'" width="'+(cw-4).toFixed(1)+'" height="'+h+'" fill="'+(isHi?'var(--c)':'var(--c-soft)')+'" stroke="var(--c)" stroke-width="2" rx="4"/>'
      + svgTxt(x+cw/2-2, y0+h/2+7, d, {size:18, color:isHi?'var(--paper-raise)':'var(--c)'});
  });
  return svgOpen('0 0 '+W+' 100', 100) + inner + '</svg>';
}
function diagSquareArea(spec){

    + '<rect x="45" y="20" width="110" height="110" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5" rx="3"/>'

function diagIconRow(spec){

    + '<line x1="170" y1="45" x2="170" y2="65" stroke="var(--c)" stroke-width="2"/>'

    + '<path d="M 148 65 Q 170 90 192 65 Z" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2"/>'

function renderDiagram(spec){
  if(!spec) return '';
  switch(spec.type){
    case 'rectDims': return diagRectDims(spec);
    case 'rightTriangle': return diagRightTriangle(spec);
    case 'circle': return diagCircle(spec);
    case 'angle': return diagAngle(spec);
    case 'polygon': return diagPolygon(spec);
    case 'fractionBar': return diagFractionBar(spec);
    case 'percentBar': return diagPercentBar(spec);
    case 'numberLineDots': return diagNumberLineDots(spec);
    case 'signedJump': return diagSignedJump(spec);
    case 'coordPoints': return diagCoordPoints(spec);
    case 'placeValueChart': return diagPlaceValueChart(spec);
    case 'squareArea': return diagSquareArea(spec);
    case 'iconRow': return diagIconRow(spec);
    case 'balanceScale': return diagBalanceScale();
    default: return '';
  }
}

/* ============== AI hint (Claude) — falls back to the static concept text
   when the sample capability isn't available (e.g. self-hosted outside Claude) */
let cachedSample; // undefined = not checked yet, null = unavailable, function = ready
async function getSample(){
  if(cachedSample !== undefined) return cachedSample;
  if(typeof window==='undefined' || !window.claude || !window.claude.use){ cachedSample = null; return null; }
  try{ cachedSample = await window.claude.use('sample'); }catch(e){ cachedSample = null; }
  return cachedSample;
}
function buildHintPrompt(problem, grade){
  const plainPrompt = String(problem.prompt).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  return 'You are a warm, encouraging math tutor helping a grade '+(grade||4)+' student who is stuck. '+
    'Topic: '+TOPIC_LABEL[problem.subtopic]+'. Their practice problem is:\n"'+plainPrompt+'"\n\n'+
    'Give ONE short hint (2-3 sentences, simple age-appropriate language) that explains the METHOD or the first step to take. '+
    'Do NOT reveal the final answer and do NOT solve the whole problem for them — just point them toward the approach.';
}

/* Chat thread for follow-up questions under the hint. problem.chat holds the
   full turn history (index 0 is the hidden setup prompt, never shown), and
   is resent in full on every call since the sample capability has no memory. */
function chatBubbleHtml(turn){
  const shown = turn.display!==undefined ? turn.display : turn.content;
  if(turn.role==='user') return '<div class="chat-bubble chat-user">'+esc(shown)+'</div>';
  return '<div class="chat-bubble chat-claude"><span class="hint-source">🤖 Claude</span>'+esc(shown)+'</div>';
}
function renderHelpPanel(problem, aiAvailable){
  const panel = document.getElementById('help-panel');
  if(!panel) return;
  let html = (problem.chat||[]).slice(1).map(chatBubbleHtml).join('');
  if(aiAvailable){
    html += '<div class="chat-ask-row"><input type="text" id="chat-input" placeholder="Ask a follow-up question..." autocomplete="off"><button class="btn btn-ghost" id="chat-send-btn">Ask</button></div>';
  }
  panel.innerHTML = html;
  const inp = document.getElementById('chat-input'), send = document.getElementById('chat-send-btn');
  if(inp && send){
    const submit = ()=> askFollowup(problem);
    send.addEventListener('click', submit);
    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
  }
}
async function askFollowup(problem){
  const inp = document.getElementById('chat-input');
  if(!inp) return;
  const question = inp.value.trim();
  if(!question) return;
  problem.chat.push({ role:'user', content: question+'\n\n(Reminder: still do not reveal the final answer — just help me understand the approach.)', display: question });
  renderHelpPanel(problem, true);
  const panel = document.getElementById('help-panel');
  panel.insertAdjacentHTML('beforeend', '<div class="chat-bubble chat-claude" id="chat-pending"><span class="hint-source">🤖 Claude</span>Thinking…</div>');
  const askRow = panel.querySelector('.chat-ask-row'); if(askRow) askRow.remove();
  const sampleFn = await getSample();
  if(!sampleFn){
    const el=document.getElementById('chat-pending'); if(el) el.remove();
    renderHelpPanel(problem, false);
    return;
  }
  try{
    const result = await sampleFn(problem.chat, {
      modelTier:'quick',
      onText: ({text})=>{ const el=document.getElementById('chat-pending'); if(el) el.innerHTML = '<span class="hint-source">🤖 Claude</span>'+esc(text); }
    });
    problem.chat.push({ role:'assistant', content: result.text || 'Sorry, I am not sure about that one — try asking your teacher.' });
  }catch(e){
    problem.chat.push({ role:'assistant', content:'Sorry, I could not answer that just now. Try asking again.' });
  }
  renderHelpPanel(problem, true);
}

function accuracyFor(data, subtopics){
  let correct=0, attempted=0;
  subtopics.forEach(st=>{ const s=data.topicStats[st]; if(s){ correct+=s.correct; attempted+=s.attempted; } });
  return attempted>0 ? Math.round(100*correct/attempted) : null;
}
function dayTrail(data, band){
  const strandKeys = Object.keys(strandsFor(band));
  const frontier = data.currentDay||1;
  const start = Math.max(1, frontier-6);
  const trail=[];
  for(let d=start; d<=frontier; d++){

    const n = dayObj ? strandKeys.filter(k=>dayObj[k]&&dayObj[k].done).length : 0;
    trail.push({ day:d, n, total:strandKeys.length, isCurrent:d===frontier });
  }
  return trail;
}

/* ============== session ============== */
function pickSubtopicSequence(strand, data, dayNum){
  const unlocked = currentPhaseIndex(data)>=1 && strand.advanced ? strand.subtopics.concat(strand.advanced) : strand.subtopics;
  const subs = unlocked;
  const shift = dayNum % subs.length;
  const rotated = subs.slice(shift).concat(subs.slice(0,shift));
  const focusCount = Math.min(3, subs.length);
  const focus = rotated.slice(0,focusCount);
  const weights = focus.map(st=>{
    const s = data.topicStats[st];
    const acc = s && s.attempted>0 ? s.correct/s.attempted : 0.75;
    return 1 + (1-acc)*2;
  });
  const seq=[];
  for(let i=0;i<PROBLEMS_PER_SESSION;i++){
    let r = Math.random()*weights.reduce((a,b)=>a+b,0);
    let idx=0; for(;idx<weights.length;idx++){ r-=weights[idx]; if(r<=0) break; }
    seq.push(focus[Math.min(idx,focus.length-1)]);
  }
  return seq;
}
function startSession(strandKey){
  const profile = currentProfile();
  const band = bandForGrade(profile.grade);
  const strand = strandsFor(band)[strandKey];
  const data = currentData();
  ensureBand(data, band);
  const dayNum = data.currentDay||1;
  ensureDay(data, band, dayNum);
  const wasDone = data.days[dayNum][strandKey].done;
  const seq = pickSubtopicSequence(strand, data, dayNum);
  const problems = seq.map(st=>{ const p = GENERATORS[st](); p.subtopic=st; return p; });
  state.session = { strandKey, band, dayNum, problems, idx:0, correct:0, assisted:0, answered:0, timeLeft:SESSION_LENGTH_SEC, timerId:null, checked:false, wasDone, reviewLog:[] };
  state.screen='session';
  render();
  const timerEl = ()=>document.getElementById('timer-val');
  state.session.timerId = setInterval(()=>{
    state.session.timeLeft--;
    const el = timerEl();
    if(el){ el.textContent = fmtTime(state.session.timeLeft); if(state.session.timeLeft<=60) el.parentElement.classList.add('low'); }
    if(state.session.timeLeft<=0){ clearInterval(state.session.timerId); finishSession(); }
  },1000);
}
function fmtTime(sec){ sec=Math.max(0,sec); return Math.floor(sec/60)+':'+pad2(sec%60); }

function submitAnswer(rawInput){
  const sess = state.session;
  const problem = sess.problems[sess.idx];
  const strand = strandsFor(sess.band)[sess.strandKey];
  let isCorrect;
  if(problem.check){ isCorrect = problem.check(rawInput); }
  else if(problem.type==='choice'){ isCorrect = rawInput===problem.answer; }
  else { isCorrect = checkNumber(rawInput, problem.answer); }

  const wasAssisted = !!problem.assisted;
  sess.answered++;
  if(isCorrect && !wasAssisted) sess.correct++;
  if(wasAssisted) sess.assisted = (sess.assisted||0)+1;
  const data = currentData();
  const s = data.topicStats[problem.subtopic] || {correct:0, attempted:0, assisted:0, log:[]};
  s.attempted++;
  if(wasAssisted) s.assisted = (s.assisted||0)+1;
  if(isCorrect && !wasAssisted) s.correct++;
  s.log = s.log||[]; s.log.push((isCorrect && !wasAssisted)?1:0); if(s.log.length>30) s.log.shift();
  data.topicStats[problem.subtopic] = s;
  saveData(state.profileId, data);

  sess.reviewLog.push({
    subtopic: problem.subtopic, prompt: problem.prompt, isEquation: !!problem.isEquation,
    userAnswer: rawInput, correctAnswer: problem.answer, isCorrect, assisted: wasAssisted,
    explanation: problem.explanation
  });

  if(problem.type==='choice'){
    document.querySelectorAll('[data-choice]').forEach(btn=>{
      btn.disabled=true;
      const val = btn.getAttribute('data-choice');
      if(val===problem.answer) btn.classList.add('correct');
      else if(val===rawInput) btn.classList.add('wrong');
      else btn.classList.add('dim');
    });
  } else {
    document.getElementById('answer-input').disabled=true;
    document.getElementById('check-btn').disabled=true;
  }
  document.getElementById('help-btn').disabled = true;

  const isLast = sess.idx>=sess.problems.length-1;
  document.getElementById('feedback-slot').innerHTML = `
    <div class="feedback ${isCorrect?(wasAssisted?'assisted':'correct'):'wrong'}">
      ${isCorrect?'✅ Correct!':'❌ Not quite — the answer is '+esc(String(problem.answer))+'.'}
      ${wasAssisted?'<span class="assisted-note">📝 Recorded as assisted, since the concept was explained first.</span>':''}
      <span class="explain">${problem.explanation}</span>
    </div>`;
  document.getElementById('actions-slot').innerHTML = `<button class="btn btn-primary" id="next-btn">${isLast?'Finish session':'Next problem →'}</button>`;
  document.getElementById('next-btn').addEventListener('click', ()=>{
    if(isLast){ clearInterval(sess.timerId); finishSession(); }
    else { sess.idx++; renderSession(); }
  });
}

function finishSession(){
  const sess = state.session;
  if(!sess) return;
  const data = currentData();
  const dayNum = sess.dayNum;
  ensureDay(data, sess.band, dayNum);
  const strandKey = sess.strandKey;
  const alreadyDone = data.days[dayNum][strandKey].done;
  if(!alreadyDone){
    data.days[dayNum][strandKey] = { done:true, score:sess.correct, total:sess.answered, assisted:sess.assisted||0, review:sess.reviewLog };
  } else {
    // Bonus "practice again" rounds keep the original score on record, but still
    // save their own review so the dashboard link works even for older completions
    // recorded before review-logging existed.
    data.days[dayNum][strandKey].review = sess.reviewLog;
  }
  const nowFullyDone = allDone(data.days[dayNum], sess.band);
  if(nowFullyDone && dayNum === (data.currentDay||1)){
    data.currentDay = dayNum+1;
  }
  pruneOldReviews(data, 30);
  saveData(state.profileId, data);
  state.screen='summary';
  state.session.dayNumFinished = dayNum;
  state.session.becameFullyDone = nowFullyDone;
  state.session.newStreak = computeStreak(data, sess.band);
  render();
}

      </div>
      <p class="roadmap-current">Week ${week} · <strong>${PHASES[phaseIdx].name}</strong> — ${PHASES[phaseIdx].tagline}</p>
      <p class="roadmap-disclaimer">Each question is tagged with a "Style" — the competition whose topics and difficulty it's modeled after (e.g. AMC 8, MOEMS). These are original practice questions, not reproductions of real past exam questions.</p>
    </div>

    <div class="sources-card">
      <h4>WHERE TO FIND REAL PAST EXAMS FOR GRADE ${profile.grade}</h4>
      <div class="sources-list">
        ${(BAND_OFFICIAL_SOURCES[band]||[]).map(src=>`<div class="source-row">
          <div class="source-name">${esc(src.name)}</div>
          <div class="source-note">${esc(src.note)}</div>
        </div>`).join('')}
      </div>
      <p class="sources-hint">Search each organization's own site for "past contests" or "practice problems" — official retired questions are the real thing to time yourself against.</p>
    </div>

    <div class="strand-grid">
      ${Object.values(strands).map(s=>{
        const rating = strandRating(data, s);
        const series = strandSessionSeries(data, s.key);
        const trend = trendLabel(series);
        return `<div class="trend-card" style="--c:var(--${s.color})">
          <div class="trend-head">
            <h3>${s.name}</h3>
            <span class="tier-pill">${rating.label}${rating.acc!==null?' · '+rating.acc+'%':''}</span>
          </div>
          ${sparklineSvg(series, 'var(--'+s.color+')')}
          <div class="trend-note tone-${trend.tone}">${trend.text}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="week-strip">
      <h4>TOPIC MASTERY</h4>
      ${Object.values(strands).map(s=>{
        const subs = s.subtopics.concat(s.advanced||[]);
        return `<div class="mastery-group">
          <div class="mastery-strand-label" style="color:var(--${s.color})">${s.name}</div>
          ${subs.map(st=>{
            const stat = data.topicStats[st];
            const tier = masteryTier(stat);
            const trend = subtopicTrend(stat);
            const acc = stat && stat.attempted>0 ? Math.round(100*stat.correct/stat.attempted) : 0;
            const locked = (s.advanced||[]).includes(st) && phaseIdx<1;
            return `<div class="subtopic-row">
              <div class="subtopic-name">${TOPIC_LABEL[st]}${locked?' <span class="locked-tag">unlocks Wk 5</span>':''}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${stat?acc:0}%;background:var(--${s.color})"></div></div>
              <div class="subtopic-pct num">${stat&&stat.attempted>0?acc+'%':'—'}</div>
              <div class="trend-arrow ${trend||'flat'}">${trend==='up'?'▲':trend==='down'?'▼':'–'}</div>
              <div class="tier-pill small">${tier.label}</div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>

    <div class="past-days-card">
      <h4>PAST DAYS</h4>
      ${pastDayNums.length===0 ? '<p style="color:var(--ink-faint);font-size:13px;">No days finished yet — complete Day 1 to see it here.</p>' : pastDayNums.map(d=>`
        <div class="past-day-row">
          <div class="past-day-label">Day ${d}</div>
          <div class="past-day-strands">
            ${Object.values(strands).map(s=>{
              const rec = data.days[d] && data.days[d][s.key];
              if(!rec || !rec.done) return `<span class="past-strand-chip todo" style="--c:var(--${s.color})">${s.name.split(' ')[0]}: not done</span>`;
              return `<span class="past-strand-chip" style="--c:var(--${s.color})">${s.name.split(' ')[0]}: ${rec.score}/${rec.total}${rec.assisted?' · '+rec.assisted+' asst.':''}${rec.review?` <button class="mini-review-btn" data-day="${d}" data-strand="${s.key}" title="Review ${esc(s.name)}">📋</button>`:''}</span>`;
            }).join('')}
          </div>
        </div>`).join('')}
      ${pastDayNums.length>0 ? '<p class="sources-hint">Only the most recent 30 days keep the full question-by-question review — older days still show scores.</p>' : ''}
    </div>
  `;
  document.getElementById('back-btn').addEventListener('click', ()=>{ state.screen='dashboard'; render(); });
  app.querySelectorAll('.mini-review-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = parseInt(btn.getAttribute('data-day'));
      const key = btn.getAttribute('data-strand');
      const s = strands[key];
      openReview(data.days[d][key].review||[], { strandName:s.name, color:s.color, dayNum:d, returnTo:'progress' });
    });
  });
}

/* ============== custom confirm modal (window.confirm is blocked in sandboxed iframes) ============== */
function showConfirmModal(title, message, confirmLabel, onConfirm){
  const existing = document.getElementById('modal-overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">${esc(confirmLabel)}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-cancel').addEventListener('click', close);
  overlay.querySelector('#modal-confirm').addEventListener('click', ()=>{ close(); onConfirm(); });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
}

function showRenameModal(currentName, onSave){
  const existing = document.getElementById('modal-overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Update name</h3>
      <input type="text" id="rename-input" class="modal-input" value="${esc(currentName)}" maxlength="20" autocomplete="off">
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = document.getElementById('rename-input');
  input.focus(); input.select();
  const close = ()=> overlay.remove();
  const save = ()=>{ const val=input.value.trim(); if(!val){ input.focus(); return; } close(); onSave(val); };
  overlay.querySelector('#modal-cancel').addEventListener('click', close);
  overlay.querySelector('#modal-confirm').addEventListener('click', save);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') save(); });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
}

/* ============== render: review ============== */
function openReview(log, meta){
  state.reviewLog = log||[];
  state.reviewMeta = meta||{};
  state.screen = 'review';
  render();
}
function renderReview(){
  const log = state.reviewLog||[];
  const meta = state.reviewMeta||{};
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="dash-header">
      <div>
        <h2>Review: ${esc(meta.strandName||'Session')}</h2>
        <div class="phase-line">Day ${meta.dayNum||''} · ${log.length} problem${log.length===1?'':'s'}</div>
        <button class="link-btn" id="review-back-btn">← Back</button>
      </div>
    </div>
    <div class="review-list">
      ${log.length===0 ? '<p style="color:var(--ink-faint);">No answers recorded for this session.</p>' : log.map((r,i)=>`
        <div class="review-item ${r.isCorrect?'correct':'wrong'}" style="--c:var(--${meta.color||'blue'})">
          <div class="review-mark">${r.isCorrect?'✅':'❌'}</div>
          <div class="review-body">
            <div class="review-eyebrow">Q${i+1} · ${esc(TOPIC_LABEL[r.subtopic]||'')}</div>
            <div class="${r.isEquation?'review-prompt mono':'review-prompt'}">${r.prompt}</div>
            <div class="review-answers">
              <span class="review-your">Your answer: <strong>${esc(r.userAnswer===''||r.userAnswer==null?'(blank)':String(r.userAnswer))}</strong></span>
              ${!r.isCorrect?`<span class="review-correct">Correct answer: <strong>${esc(String(r.correctAnswer))}</strong></span>`:''}
            </div>
            <div class="review-explain">${r.explanation||''}</div>
            ${r.assisted?'<span class="assisted-note">📝 This one was assisted.</span>':''}
          </div>
        </div>`).join('')}
    </div>
  `;
  document.getElementById('review-back-btn').addEventListener('click', ()=>{ state.screen = meta.returnTo||'dashboard'; render(); });
}

/* ============== router ============== */
function render(){
  if(state.screen==='login') renderLogin();
  else if(state.screen==='gradeSelect') renderGradeSelect();
  else if(state.screen==='avatarSelect') renderAvatarSelect();
  else if(state.screen==='dashboard') renderDashboard();
  else if(state.screen==='session') renderSession();
  else if(state.screen==='summary') renderSummary();
  else if(state.screen==='progress') renderProgress();
  else if(state.screen==='review') renderReview();
}
render();
})();
</script>
