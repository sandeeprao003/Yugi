/* ============== custom confirm modal (window.confirm is blocked in sandboxed iframes) ============== */
function showConfirmModal(title, message, confirmLabel, onConfirm){
  const existing = document.getElementById('modal-overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">${esc(confirmLabel)}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#modal-cancel').addEventListener('click', close);
  overlay.querySelector('#modal-confirm').addEventListener('click', ()=>{ close(); onConfirm(); });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
}

function showRenameModal(currentName, onSave){
  const existing = document.getElementById('modal-overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Update name</h3>
      <input type="text" id="rename-input" class="modal-input" value="${esc(currentName)}" maxlength="20" autocomplete="off">
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = document.getElementById('rename-input');
  input.focus(); input.select();
  const close = ()=> overlay.remove();
  const save = ()=>{ const val=input.value.trim(); if(!val){ input.focus(); return; } close(); onSave(val); };
  overlay.querySelector('#modal-cancel').addEventListener('click', close);
  overlay.querySelector('#modal-confirm').addEventListener('click', save);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') save(); });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
}

/* ============== render: learn ============== */
function makeExample(subtopic){
  const p = GENERATORS[subtopic]();
  p.subtopic = subtopic;
  return p;
}
function renderLearn(){
  const profile = currentProfile();
  if(!profile){ state.screen='login'; render(); return; }
  const subject = state.subject;
  if(!profile.grades || !profile.grades[subject]){ state.screen='gradeSelect'; render(); return; }
  const band = bandForGrade(profile.grades[subject]);
  const strand = strandsFor(subject, band)[state.learnStrand];
  if(!strand){ state.screen='dashboard'; render(); return; }
  markStudied(subject, band, state.learnStrand);
  const data = currentData();
  const phaseIdx = currentPhaseIndex(data);
  state.learnExamples = state.learnExamples || {};
  const subs = strand.subtopics.concat(strand.advanced||[]);
  subs.forEach(st=>{ if(!state.learnExamples[st]) state.learnExamples[st] = makeExample(st); });
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="dash-header">
      <div>
        <h2>📚 Learn: ${esc(strand.name)}</h2>
        <div class="phase-line">${esc(strand.tagline)}</div>
        <button class="link-btn" id="learn-back-btn">← Back to dashboard</button>
      </div>
    </div>
    <div class="lesson-list">
      ${subs.map(st=>{
        const locked = (strand.advanced||[]).includes(st) && phaseIdx<1;
        const ex = state.learnExamples[st];
        return `<div class="lesson-card" style="--c:var(--${strand.color});--c-soft:var(--${strand.color}-soft);">
          <div class="lesson-head">
            <h3>${esc(TOPIC_LABEL[st]||st)}</h3>
            ${locked?'<span class="locked-tag">unlocks Wk 5</span>':''}
          </div>
          <p class="lesson-concept">${esc(CONCEPT_HELP[st]||'')}</p>
          <div class="lesson-example">
            <div class="lesson-example-label">WORKED EXAMPLE</div>
            ${ex.diagram ? `<div class="problem-diagram">${renderDiagram(ex.diagram)}</div>` : ''}
            <div class="${ex.isEquation?'problem-eq':'problem-text'}">${ex.prompt}</div>
            <div class="lesson-answer">Answer: <strong>${esc(String(ex.answer))}</strong></div>
            <div class="lesson-explain">${ex.explanation||''}</div>
          </div>
          <div class="lesson-actions">
            <button class="link-btn" data-newex="${st}">🔄 Try another example</button>
            <button class="btn btn-ghost help-btn" id="ask-btn-${esc(st)}">❓ Ask a question</button>
          </div>
          <div id="help-panel-${esc(st)}" class="help-panel" hidden></div>
        </div>`;
      }).join('')}
    </div>
    <div class="lesson-cta">
      <button class="btn btn-primary" id="lesson-start-btn">🎯 Take the ${esc(strand.name)} assessment</button>
    </div>
  `;
  document.getElementById('learn-back-btn').addEventListener('click', ()=>{ state.screen='dashboard'; render(); });
  document.getElementById('lesson-start-btn').addEventListener('click', ()=> startSession(state.learnStrand));
  subs.forEach(st=>{
    const askBtn = document.getElementById('ask-btn-'+st);
    if(askBtn) askBtn.addEventListener('click', ()=> openAskBox(state.learnExamples[st], '-'+st));
  });
  app.querySelectorAll('[data-newex]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const st = btn.getAttribute('data-newex');
      state.learnExamples[st] = makeExample(st);
      renderLearn();
    });
  });
}

/* ============== render: review ============== */
function openReview(log, meta){
  state.reviewLog = log||[];
  state.reviewMeta = meta||{};
  state.screen = 'review';
  render();
}
function renderReview(){
  const log = state.reviewLog||[];
  const meta = state.reviewMeta||{};
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="dash-header">
      <div>
        <h2>Review: ${esc(meta.strandName||'Session')}</h2>
        <div class="phase-line">Day ${meta.dayNum||''} · ${log.length} problem${log.length===1?'':'s'}</div>
        <button class="link-btn" id="review-back-btn">← Back</button>
      </div>
    </div>
    <div class="review-list">
      ${log.length===0 ? '<p style="color:var(--ink-faint);">No answers recorded for this session.</p>' : log.map((r,i)=>`
        <div class="review-item ${r.isCorrect?'correct':'wrong'}" style="--c:var(--${meta.color||'blue'});--c-soft:var(--${meta.color||'blue'}-soft)">
          <div class="review-mark">${r.isCorrect?'✅':'❌'}</div>
          <div class="review-body">
            <div class="review-eyebrow">Q${i+1} · ${esc(TOPIC_LABEL[r.subtopic]||'')}</div>
            <div class="${r.isEquation?'review-prompt mono':'review-prompt'}">${r.prompt}</div>
            <div class="review-answers">
              <span class="review-your">Your answer: <strong>${esc(r.userAnswer===''||r.userAnswer==null?'(blank)':String(r.userAnswer))}</strong></span>
              ${!r.isCorrect?`<span class="review-correct">Correct answer: <strong>${esc(String(r.correctAnswer))}</strong></span>`:''}
            </div>
            <div class="review-explain">${r.explanation||''}</div>
            ${r.assisted?'<span class="assisted-note">📝 This one was assisted.</span>':''}
            ${r.doubts && r.doubts.length ? `<div class="review-doubts">
              <div class="review-doubts-label">💬 Questions asked about this one</div>
              ${r.doubts.map(chatBubbleHtml).join('')}

/* ============== active time tracking ==============
   Counts wall-clock seconds while the tab is visible AND the kid is on an
   actual study screen (session or learn), attributed to whichever strand/topic
   is actually open — not while idle on the dashboard, reading a summary, or
   with the tab backgrounded. Accumulates into today's day record so the Daily
   Learning Log can show real time spent per topic, not just whether it's done. */
let pendingSeconds = {}; // strandKey -> seconds not yet flushed to storage
function currentTrackedStrand(){
  if(state.screen==='session' && state.session) return state.session.strandKey;
  if(state.screen==='learn' && state.learnStrand) return state.learnStrand;
  return null;
}
function flushActiveTime(){
  const keys = Object.keys(pendingSeconds);
  if(!keys.length) return;
  const profile = currentProfile();
  if(!profile){ pendingSeconds = {}; return; }
  const grade = profile.grades && profile.grades[state.subject];
  if(!grade){ pendingSeconds = {}; return; }
  const band = bandForGrade(grade);
  const data = currentData();
  ensureBand(data, band);
  const dayNum = data.currentDay||1;
  const day = ensureDay(data, state.subject, band, dayNum);
  keys.forEach(k=>{ day.strandSeconds[k] = (day.strandSeconds[k]||0) + pendingSeconds[k]; });
  pendingSeconds = {};
  saveData(profile.id, data);
}
setInterval(()=>{
  if(document.visibilityState==='visible'){
    const strandKey = currentTrackedStrand();
    if(strandKey){
      pendingSeconds[strandKey] = (pendingSeconds[strandKey]||0) + 1;
      const total = Object.values(pendingSeconds).reduce((a,b)=>a+b,0);
      if(total>=10) flushActiveTime();
    }
  }
}, 1000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushActiveTime(); });

/* ============== router ============== */
function render(){
  flushActiveTime();
  const appEl = document.getElementById('app');
  if(appEl) appEl.className = state.screen==='dashboard' ? 'wide' : '';
  if(state.screen==='login') renderLogin();
  else if(state.screen==='gradeSelect') renderGradeSelect();
  else if(state.screen==='avatarSelect') renderAvatarSelect();
  else if(state.screen==='apiKeySettings') renderApiKeySettings();
  else if(state.screen==='dashboard') renderDashboard();
  else if(state.screen==='learn') renderLearn();
  else if(state.screen==='session') renderSession();
  else if(state.screen==='summary') renderSummary();
  else if(state.screen==='progress') renderProgress();
  else if(state.screen==='review') renderReview();
  else if(state.screen==='doubtsReport') renderDoubtsReport();
  else if(state.screen==='themeSelect') renderThemeSelect();
}
applyTheme(getTheme());
render();
})();
</script>
