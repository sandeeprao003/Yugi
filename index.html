<title>Yuji</title>
<meta name="apple-mobile-web-app-title" content="Yuji">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#FBF9F4;
  --paper-raise:#FFFFFF;
  --grid:#E4DECD;
  --ink:#26313A;
  --ink-soft:#5E6971;
  --ink-faint:#8B9298;
  --blue:#3D6EDB;      --blue-soft:#E9EFFC;    --blue-line:#C7D6F6;
  --amber:#C97A1E;     --amber-soft:#FBEEDD;   --amber-line:#F0D6AE;
  --teal:#1C8E76;      --teal-soft:#E1F3EE;    --teal-line:#B9E2D6;
  --good:#2E8F52;      --good-soft:#E4F5EA;
  --bad:#C3453A;       --bad-soft:#FBEAE8;
  --info:#7A5FC9;      --info-soft:#EFEAFB;
  --shadow: 0 1px 2px rgba(38,49,58,.06), 0 6px 16px rgba(38,49,58,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C2126;
    --paper-raise:#242A31;
    --grid:rgba(232,227,214,.09);
    --ink:#ECE7DA;
    --ink-soft:#AAB2B8;
    --ink-faint:#7C848B;
    --blue:#7FA0F2;    --blue-soft:rgba(127,160,242,.14);  --blue-line:rgba(127,160,242,.35);
    --amber:#EDA84F;   --amber-soft:rgba(237,168,79,.14);  --amber-line:rgba(237,168,79,.35);
    --teal:#57C7A9;    --teal-soft:rgba(87,199,169,.14);   --teal-line:rgba(87,199,169,.35);
    --good:#5FC783;    --good-soft:rgba(95,199,131,.14);
    --bad:#E8776B;     --bad-soft:rgba(232,119,107,.14);
    --info:#A98CF0;    --info-soft:rgba(169,140,240,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#1C2126;
  --paper-raise:#242A31;
  --grid:rgba(232,227,214,.09);
  --ink:#ECE7DA;
  --ink-soft:#AAB2B8;
  --ink-faint:#7C848B;
  --blue:#7FA0F2;    --blue-soft:rgba(127,160,242,.14);  --blue-line:rgba(127,160,242,.35);
  --amber:#EDA84F;   --amber-soft:rgba(237,168,79,.14);  --amber-line:rgba(237,168,79,.35);
  --teal:#57C7A9;    --teal-soft:rgba(87,199,169,.14);   --teal-line:rgba(87,199,169,.35);
  --good:#5FC783;    --good-soft:rgba(95,199,131,.14);
  --bad:#E8776B;     --bad-soft:rgba(232,119,107,.14);
  --info:#A98CF0;    --info-soft:rgba(169,140,240,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}
/* ---------- Kid-picked color themes (separate from light/dark; see THEMES in JS) ---------- */
:root[data-color-theme="neonArcade"]{
  --paper:#150E28; --paper-raise:#1F1640; --grid:rgba(255,255,255,.09);
  --ink:#F5EFFF; --ink-soft:#C6B8E8; --ink-faint:#8F7FB8;
  --blue:#00E5FF;  --blue-soft:rgba(0,229,255,.16);  --blue-line:rgba(0,229,255,.4);
  --amber:#FF3EC9; --amber-soft:rgba(255,62,201,.16); --amber-line:rgba(255,62,201,.4);
  --teal:#39FF88;  --teal-soft:rgba(57,255,136,.16);  --teal-line:rgba(57,255,136,.4);
  --good:#39FF88;  --good-soft:rgba(57,255,136,.14);
  --bad:#FF5C7A;   --bad-soft:rgba(255,92,122,.14);
  --info:#B98CFF;  --info-soft:rgba(185,140,255,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.5);
}
:root[data-color-theme="candyPop"]{
  --paper:#FFF9FC; --paper-raise:#FFFFFF; --grid:#FFE1EE;
  --ink:#4A2E3D; --ink-soft:#7A5A6B; --ink-faint:#A98CA0;
  --blue:#4FC4C0;  --blue-soft:#E3F9F7;  --blue-line:#BDEFEA;
  --amber:#FFA630; --amber-soft:#FFF0DC; --amber-line:#FFDCA8;
  --teal:#D9509A;  --teal-soft:#FDE6F1;  --teal-line:#F8C2DE;
  --good:#4CAF7D;  --good-soft:#E4F5EC;
  --bad:#E4576B;   --bad-soft:#FDE8EA;
  --info:#8B6FE8;  --info-soft:#EEE9FC;
  --shadow: 0 1px 2px rgba(74,46,61,.08), 0 6px 16px rgba(74,46,61,.1);
}
:root[data-color-theme="galaxy"]{
  --paper:#0D0B21; --paper-raise:#171335; --grid:rgba(255,255,255,.08);
  --ink:#ECE8FF; --ink-soft:#B5ACDD; --ink-faint:#8377B0;
  --blue:#7B61FF;  --blue-soft:rgba(123,97,255,.16);  --blue-line:rgba(123,97,255,.4);
  --amber:#FF61A6; --amber-soft:rgba(255,97,166,.16); --amber-line:rgba(255,97,166,.4);
  --teal:#00D9FF;  --teal-soft:rgba(0,217,255,.16);   --teal-line:rgba(0,217,255,.4);
  --good:#4FE0A0;  --good-soft:rgba(79,224,160,.14);
  --bad:#FF6B7A;   --bad-soft:rgba(255,107,122,.14);
  --info:#A98CF0;  --info-soft:rgba(169,140,240,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.5);
}
:root[data-color-theme="blockyCraft"]{
  --paper:#F6FBF1; --paper-raise:#FFFFFF; --grid:#DCEFCB;
  --ink:#28351F; --ink-soft:#57684A; --ink-faint:#8B9A7D;
  --blue:#3D9BDC;  --blue-soft:#E3F3FC;  --blue-line:#BFE3F6;
  --amber:#E0A526; --amber-soft:#FBF0D6; --amber-line:#F3DC9E;
  --teal:#3F9D5E;  --teal-soft:#E3F5E7;  --teal-line:#BEE6C8;
  --good:#3F9D5E;  --good-soft:#E3F5E7;
  --bad:#C6543D;   --bad-soft:#FAE4DE;
  --info:#7D6BC9;  --info-soft:#EBE7FA;
  --shadow: 0 1px 2px rgba(40,53,31,.08), 0 6px 16px rgba(40,53,31,.1);
}
:root[data-color-theme="cyberMint"]{
  --paper:#081714; --paper-raise:#0F241F; --grid:rgba(255,255,255,.08);
  --ink:#E5FFF6; --ink-soft:#9FCDBE; --ink-faint:#6B9186;
  --blue:#3D5AFE;  --blue-soft:rgba(61,90,254,.16);  --blue-line:rgba(61,90,254,.4);
  --amber:#FF3D71; --amber-soft:rgba(255,61,113,.16); --amber-line:rgba(255,61,113,.4);
  --teal:#00FFB2;  --teal-soft:rgba(0,255,178,.16);   --teal-line:rgba(0,255,178,.4);
  --good:#00FFB2;  --good-soft:rgba(0,255,178,.14);
  --bad:#FF3D71;   --bad-soft:rgba(255,61,113,.14);
  --info:#7B8CFF;  --info-soft:rgba(123,140,255,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/32px 100%,
    var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{ font-family:'Fredoka',system-ui,sans-serif; text-wrap:balance; }
.num, .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

#app{ max-width:920px; margin:0 auto; padding:28px 20px 64px; transition:max-width .15s ease; }
#app.wide{ max-width:1300px; }

.eyebrow{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }

.btn{
  border:none; border-radius:12px; padding:12px 22px; font-weight:600; font-size:15px;
  cursor:pointer; transition:transform .1s ease, box-shadow .15s ease, filter .15s ease;
  font-family:'Fredoka',system-ui,sans-serif;
}
.btn:hover{ filter:brightness(1.04); }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--ink); color:var(--paper); box-shadow:var(--shadow); }
.btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--grid); }
.btn-strand{ color:#fff; box-shadow:var(--shadow); }
.btn:disabled{ opacity:.45; cursor:default; }

/* ---------- Login ---------- */
.login-wrap{ padding-top:6vh; }
.brand{ text-align:center; margin-bottom:40px; }
.brand h1{ font-size:40px; margin:0 0 8px; color:var(--ink); }
.brand .tag{ color:var(--ink-soft); font-size:16px; max-width:480px; margin:0 auto; }
.brand .tag .num{ color:var(--blue); font-weight:600; }
.tabs{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
.tab{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:16px 16px 4px 4px;
  padding:20px 22px; min-width:150px; text-align:center; cursor:pointer; box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.tab:hover{ transform:translateY(-3px); }
.tab .badge{
  width:48px; height:48px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center;
  justify-content:center; font-family:'Fredoka'; font-weight:600; font-size:20px; color:#fff;
}
.avatar-badge{ background:var(--grid) !important; overflow:hidden; }
.avatar-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:14px; max-width:520px; margin:0 auto; }
.avatar-option{
  background:var(--paper-raise); border:2.5px solid var(--grid); border-radius:16px; padding:8px; cursor:pointer;
  transition:transform .12s ease, border-color .12s ease; box-shadow:var(--shadow);
}
.avatar-option:hover{ transform:translateY(-3px); }
.avatar-option.selected{ border-color:var(--blue); }
.avatar-option svg{ display:block; width:100%; height:auto; }
.theme-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; max-width:600px; margin:0 auto; }
.theme-option{
  background:var(--paper-raise); border:2.5px solid var(--grid); border-radius:16px; padding:16px 12px; cursor:pointer;
  transition:transform .12s ease, border-color .12s ease; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:10px; font-family:inherit;
}
.theme-option:hover{ transform:translateY(-3px); }
.theme-option.selected{ border-color:var(--blue); }
.theme-swatches{ display:flex; gap:6px; }
.theme-swatch{ width:26px; height:26px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
.theme-name{ font-family:'Fredoka'; font-weight:600; font-size:14px; color:var(--ink); }
.tab .name{ font-weight:600; font-size:16px; }
.tab .streak{ margin-top:6px; font-size:12px; color:var(--ink-faint); }
.tab-new{ border-style:dashed; color:var(--ink-faint); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
.new-form{ display:flex; gap:8px; margin-top:8px; }
.new-form input{
  font-family:inherit; font-size:15px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--grid);
  background:var(--paper); color:var(--ink); width:150px;
}
.grade-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; max-width:640px; margin:0 auto; }
.grade-btn{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:20px 12px;
  font-family:'Fredoka'; font-weight:600; font-size:20px; color:var(--ink); cursor:pointer; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .12s ease, border-color .12s ease;
}
.grade-btn:hover{ transform:translateY(-3px); border-color:var(--blue); }
.grade-band-label{ font-family:'Inter'; font-weight:500; font-size:11px; color:var(--ink-faint); }

/* ---------- Dashboard ---------- */
.dashboard-grid{ display:grid; grid-template-columns:260px 1fr; gap:24px; align-items:start; }
.daily-log-sidebar{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:16px 18px;
  box-shadow:var(--shadow); position:sticky; top:20px; max-height:calc(100vh - 40px); overflow-y:auto;
}
.daily-log-sidebar h4{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:.03em; position:sticky; top:0; background:var(--paper-raise); }
.dashboard-main{ min-width:0; }
.day-log-list{ display:flex; flex-direction:column; gap:12px; overflow-y:auto; max-height:calc(100vh - 140px); padding-right:4px; }
.day-log-row{
  background:var(--paper); border:1px solid var(--grid); border-radius:10px; padding:10px 10px 8px;
}
.day-log-row-header{ display:flex; align-items:center; gap:8px; font-family:'Fredoka'; font-weight:700; font-size:13px; margin-bottom:8px; }
.day-log-row .doubts-chip{ margin:0; }
.day-log-row-topics{ display:flex; flex-wrap:wrap; gap:6px; }
.day-log-chip{
  flex:1 1 72px; font-size:11px; font-weight:600; padding:6px 7px; border-radius:8px; background:var(--c-soft, var(--grid));
  color:var(--c, var(--ink-soft)); text-align:center; display:flex; flex-direction:column; gap:2px;
}
.day-log-chip.todo{ background:var(--grid); color:var(--ink-faint); font-weight:500; }
.day-log-chip.todo.studied{ background:var(--c-soft, var(--grid)); color:var(--c, var(--ink-soft)); }
.day-log-score{ font-size:10px; font-weight:500; opacity:.85; }
.day-log-row .mini-review-btn{ font-size:10px; color:inherit; text-decoration:underline; }
@media (max-width:860px){
  .dashboard-grid{ grid-template-columns:1fr; }
  .daily-log-sidebar{ position:static; max-height:none; order:2; }
  .daily-log-sidebar h4{ position:static; }
  .day-log-list{ max-height:420px; }
  .dashboard-main{ order:1; }
}
.subject-switch{ display:flex; gap:10px; margin-bottom:18px; }
.subject-tab{
  flex:1; padding:12px 14px; border-radius:14px; border:2px solid var(--grid); background:var(--paper-raise);
  font-family:'Fredoka'; font-weight:600; font-size:15px; color:var(--ink-faint); cursor:pointer; transition:all .15s;
}
.subject-tab.active{ border-color:var(--blue); color:var(--blue); background:var(--blue-soft); }
.subject-tab:hover{ transform:translateY(-2px); }
.dash-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
.dash-header-left{ display:flex; align-items:center; gap:14px; }
.dash-avatar{ width:56px; height:56px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--grid); }
.dash-avatar svg{ display:block; width:100%; height:100%; }
.dash-header h2{ margin:0; font-size:26px; }
.streak-pill{
  display:inline-flex; align-items:center; gap:6px; background:var(--amber-soft); color:var(--amber);
  padding:6px 14px; border-radius:999px; font-weight:700; font-size:14px;
}
.link-btn{ background:none; border:none; color:var(--ink-faint); text-decoration:underline; cursor:pointer; font-size:14px; font-family:inherit; }

.today-bar{ background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:16px 18px; margin-bottom:22px; box-shadow:var(--shadow); }
.today-bar .row1{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.today-bar .row1 strong{ font-family:'Fredoka'; font-size:15px; }
.dots{ display:flex; gap:8px; }
.dot{ width:34px; height:10px; border-radius:6px; background:var(--grid); }
.dot.on{ background:var(--good); }

.strand-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:26px; }
.strand-card{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:16px; padding:20px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; border-top:5px solid var(--c);
}
.strand-card .icon{ width:38px; height:38px; }
.strand-card h3{ margin:0; font-size:18px; }
.strand-card .sub{ font-size:13px; color:var(--ink-soft); line-height:1.5; min-height:38px; }
.status-pill{ align-self:flex-start; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; }
.status-pill.done{ background:var(--good-soft); color:var(--good); }
.status-pill.todo{ background:var(--c-soft); color:var(--c); }
.acc{ font-size:12px; color:var(--ink-faint); }

.week-strip{ background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
.dashboard-report{ margin-top:28px; padding-top:22px; border-top:2px dashed var(--grid); }
.dashboard-report .report-section:last-child{ margin-bottom:0; }
.dashboard-report .strand-grid, .dashboard-report .week-strip{ margin-top:18px; }
.week-strip h4{ margin:0 0 12px; font-size:13px; color:var(--ink-soft); font-weight:700; letter-spacing:.03em; }
.week-cols{ display:flex; gap:10px; justify-content:space-between; }
.week-col{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
.week-col .lbl{ font-size:11px; color:var(--ink-faint); }
.week-col .bar{ width:100%; max-width:26px; height:52px; background:var(--grid); border-radius:6px; display:flex; flex-direction:column-reverse; overflow:hidden; }
.week-col .fill{ background:var(--teal); width:100%; }
.week-col.today .lbl{ color:var(--ink); font-weight:700; }

/* ---------- Session ---------- */
.session-top{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-radius:14px; margin-bottom:22px; }
.session-top .timer{ font-size:20px; font-weight:600; }
.session-top .timer.low{ color:var(--bad); }
.progress-track{ height:6px; border-radius:4px; background:rgba(0,0,0,.08); margin-bottom:26px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--c); transition:width .3s ease; }

.problem-card{
  background:var(--paper-raise); border:1.5px solid var(--grid); border-radius:20px; padding:36px 32px;
  box-shadow:var(--shadow); text-align:center; min-height:220px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
}
.problem-card .eyebrow{ color:var(--c); }
.problem-tags{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
.exam-tag{ font-size:11px; font-weight:600; color:var(--ink-faint); background:var(--grid); padding:3px 9px; border-radius:999px; }
.problem-eq{ font-family:'IBM Plex Mono'; font-weight:600; font-size:clamp(24px,5vw,34px); font-variant-numeric:tabular-nums; }
.problem-text{ font-size:19px; line-height:1.55; max-width:56ch; }
.problem-text .num{ font-weight:600; color:var(--c); }

.answer-row{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:6px; }
.answer-input{
  font-family:'IBM Plex Mono'; font-size:20px; padding:12px 16px; border-radius:12px; border:2px solid var(--grid);
  background:var(--paper); color:var(--ink); width:160px; text-align:center;
}
.answer-input:focus{ border-color:var(--c); }
.choice-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
.choice-btn{
  border:2px solid var(--grid); background:var(--paper); color:var(--ink); border-radius:12px;
  padding:12px 20px; font-size:16px; font-weight:600; cursor:pointer; font-family:'Fredoka';
}
.choice-btn:hover{ border-color:var(--c); }
.choice-btn.correct{ background:var(--good-soft); border-color:var(--good); color:var(--good); }
.choice-btn.wrong{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }
.choice-btn.dim{ opacity:.5; }

.feedback{ margin-top:6px; padding:14px 18px; border-radius:12px; font-size:15px; max-width:52ch; }
.feedback.correct{ background:var(--good-soft); color:var(--good); }
.feedback.wrong{ background:var(--bad-soft); color:var(--bad); }
.feedback.assisted{ background:var(--info-soft); color:var(--info); }
.feedback .explain{ color:var(--ink-soft); font-weight:400; margin-top:4px; display:block; }
.assisted-note{ color:var(--info); font-weight:600; display:block; margin-top:6px; font-size:13px; }

.help-row{ margin-top:2px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.help-btn{ font-size:13px; padding:8px 16px; }
.help-btn:disabled{ opacity:.6; }
.help-panel{ display:flex; flex-direction:column; gap:8px; max-width:52ch; width:100%; text-align:left; }
.help-panel[hidden]{ display:none; }
.hint-source{ font-size:11px; font-weight:700; background:var(--info); color:var(--paper-raise); padding:2px 7px; border-radius:999px; margin-right:6px; white-space:nowrap; }
.chat-bubble{ padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.5; }
.chat-bubble.chat-claude{ background:var(--info-soft); color:var(--info); align-self:flex-start; max-width:100%; }
.chat-bubble.chat-user{ background:var(--grid); color:var(--ink); align-self:flex-end; max-width:85%; }
.chat-ask-row{ display:flex; gap:8px; }

function genPlaceValue(){
  const variant = pick(['digitValue','round','compare','expanded']);
  if(variant==='digitValue'){
    const num = randInt(100000,987654);
    const placeNames=['hundred-thousands','ten-thousands','thousands','hundreds','tens','ones'];
    const placeValues=[100000,10000,1000,100,10,1];
    const pos = randInt(0,5);
    const digitsArr = String(num).split('');
    const digit = parseInt(digitsArr[pos]);
    const value = digit*placeValues[pos];
    const highlighted = digitsArr.map((ch,i)=> i===pos ? '<strong>'+ch+'</strong>' : ch).join('');
    return { isEquation:false, prompt:'What is the value of the digit in '+N(highlighted)+' shown in bold?',
      type:'number', answer:value,
      explanation:'The bold digit is in the '+placeNames[pos]+' place, so its value is '+digit+' × '+fmt(placeValues[pos])+' = '+fmt(value)+'.',
      diagram:{type:'placeValueChart', digits:digitsArr, highlightPos:pos} };
  }
  if(variant==='round'){
    const num = randInt(1000,987654);
    const place = pick([10,100,1000,10000]);
    const rounded = Math.round(num/place)*place;
    return { isEquation:false, prompt:'Round '+N(fmt(num))+' to the nearest '+N(fmt(place))+'.',
      type:'number', answer:rounded, explanation:fmt(num)+' rounds to '+fmt(rounded)+'.' };
  }
  if(variant==='compare'){
    let a=randInt(1000,99999), b= Math.random()<0.15 ? a : randInt(1000,99999);
    const symbol = a<b?'<':a>b?'>':'=';
    return { isEquation:true, prompt:fmt(a)+' &nbsp;___&nbsp; '+fmt(b),
      type:'choice', choices:shuffle(['<','>','=']), answer:symbol,
      explanation:fmt(a)+' '+symbol+' '+fmt(b)+'.' };
  }
  // expanded
  const parts=[]; let sum=0;
  const places=[100000,10000,1000,100,10,1];
  places.forEach(p=>{ if(Math.random()<0.75 || p===1){ const d=randInt(1,9); parts.push(d*p); sum+=d*p; } });
  if(parts.length<2){ parts.push(4*10); sum+=40; }
  return { isEquation:false, prompt:'What number is '+N(parts.map(fmt).join(' + '))+'?',
    type:'number', answer:sum, explanation:parts.map(fmt).join(' + ')+' = '+fmt(sum)+'.' };
}

    const a=randInt(2000,99999), b=randInt(1000,a-1); return { isEquation:true, prompt:fmt(a)+' - '+fmt(b)+' = ?', type:'number', answer:a-b, explanation:fmt(a)+' - '+fmt(b)+' = '+fmt(a-b)+'.' };
  }
  const n1=pick(NAMES), n2=pick(NAMES.filter(n=>n!==n1)), item=pick(ITEMS);
  if(op==='add'){
    const a=randInt(120,4800), b=randInt(90,4800);
    return { isEquation:false, prompt:n1+' collected '+N(fmt(a))+' '+item+' and '+n2+' collected '+N(fmt(b))+' more '+item+'. How many '+item+' did they collect in total?',

function genDivision(){

    return { isEquation:true, prompt:fmt(dividend)+' ÷ '+divisor+' = ?', type:'number', answer:quotient, explanation:fmt(dividend)+' ÷ '+divisor+' = '+quotient+'.' }; }
  const divisor=randInt(2,9), quotient=randInt(5,99), remainder=randInt(1,divisor-1), dividend=divisor*quotient+remainder;

function genFactorsMultiples(){
  const variant = pick(['primeComposite','gcf','lcm','listFactors']);
  function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++){ if(n%i===0) return false; } return true; }
  function factorsOf(n){ const f=[]; for(let i=1;i<=n;i++){ if(n%i===0) f.push(i); } return f; }
  if(variant==='primeComposite'){ const n=randInt(2,60); const ans = isPrime(n) ? 'Prime' : 'Composite';
    return { isEquation:false, prompt:'Is '+N(n)+' prime or composite?', type:'choice', choices:shuffle(['Prime','Composite']), answer:ans,
      explanation: ans==='Prime' ? n+' has only two factors: 1 and '+n+'.' : n+' has factors besides 1 and itself: '+factorsOf(n).join(', ')+'.' }; }
  if(variant==='gcf'){ const a=randInt(6,48), b=randInt(6,48); const g=gcd(a,b);
    return { isEquation:false, prompt:'What is the greatest common factor of '+N(a)+' and '+N(b)+'?', type:'number', answer:g, explanation:'The largest number that divides both '+a+' and '+b+' evenly is '+g+'.' }; }
  if(variant==='lcm'){ const a=randInt(2,12), b=randInt(2,12); const l=(a*b)/gcd(a,b);
    return { isEquation:false, prompt:'What is the least common multiple of '+N(a)+' and '+N(b)+'?', type:'number', answer:l, explanation:'The smallest number that is a multiple of both '+a+' and '+b+' is '+l+'.' }; }
  const n=randInt(12,48); const f=factorsOf(n);
  return { isEquation:false, prompt:'How many factors does '+N(n)+' have (including 1 and '+n+')?', type:'number', answer:f.length, explanation:'The factors of '+n+' are '+f.join(', ')+' — that is '+f.length+' factors.' };
}

function genFracEquivalence(){
  const variant = pick(['missing','compare','simplify']);
  if(variant==='missing'){ const d1=randInt(2,9), mult=randInt(2,6), n1=randInt(1,d1-1), d2=d1*mult, n2=n1*mult;
    const askNumerator = Math.random()<0.7;
    if(askNumerator){ return { isEquation:true, prompt:n1+'/'+d1+' = ?/'+d2, type:'number', answer:n2, explanation:n1+'/'+d1+' × '+mult+'/'+mult+' = '+n2+'/'+d2+'.', diagram:{type:'fractionBar', d:d1, shaded:[n1]} }; }
    return { isEquation:true, prompt:n1+'/'+d1+' = '+n2+'/?', type:'number', answer:d2, explanation:n1+'/'+d1+' × '+mult+'/'+mult+' = '+n2+'/'+d2+'.', diagram:{type:'fractionBar', d:d1, shaded:[n1]} }; }
  if(variant==='compare'){ const d1=randInt(2,12), d2=randInt(2,12), n1=randInt(1,d1-1), n2=randInt(1,d2-1);
    const cross1=n1*d2, cross2=n2*d1; const symbol = cross1<cross2?'<':cross1>cross2?'>':'=';
    return { isEquation:true, prompt:n1+'/'+d1+' &nbsp;___&nbsp; '+n2+'/'+d2, type:'choice', choices:shuffle(['<','>','=']), answer:symbol,
      explanation:n1+'/'+d1+' '+symbol+' '+n2+'/'+d2+'.' }; }
  const rd=randInt(2,9); let rn=randInt(1,rd-1); const [srn,srd]=reduceFrac(rn,rd);
  const k=randInt(2,6); const n=srn*k, d=srd*k;
  return { isEquation:true, prompt:'Simplify '+n+'/'+d+' to lowest terms.', type:'text', placeholder:'e.g. 3/4', answer:srn+'/'+srd,
    check:(input)=>{ const p=parseFrac(input); if(!p) return false; const r=reduceFrac(p[0],p[1]); return r[0]===srn && r[1]===srd; },
    explanation:n+'/'+d+' simplifies to '+srn+'/'+srd+' (divide top and bottom by '+gcd(n,d)+').', diagram:{type:'fractionBar', d, shaded:[n]} };
}

  return { isEquation:true, prompt:n1+'/'+d+' '+symbol+' '+n2+'/'+d+' = ?', type:'text', placeholder:'e.g. 5/'+d,

    check:(input)=>answerMatchesFraction(input, resultN, d),

  if(variant==='compare'){ const a=(randInt(1,99)/100).toFixed(2), b=(randInt(1,99)/100).toFixed(2);
    const symbol = parseFloat(a)<parseFloat(b)?'<':parseFloat(a)>parseFloat(b)?'>':'=';
    return { isEquation:true, prompt:a+' &nbsp;___&nbsp; '+b, type:'choice', choices:shuffle(['<','>','=']), answer:symbol, explanation:a+' '+symbol+' '+b+'.' }; }
  if(variant==='add'){ const a=randInt(1,999)/100, b=randInt(1,999)/100; const sum=Math.round((a+b)*100)/100;
    return { isEquation:true, prompt:a.toFixed(2)+' + '+b.toFixed(2)+' = ?', type:'text', placeholder:'e.g. 1.25',

function genDataLinePlot(){
  const count = randInt(6,9);
  const quarters=[]; for(let i=0;i<count;i++){ quarters.push(randInt(8,24)); }
  quarters.sort((a,b)=>a-b);
  const listStr = quarters.map(q=>fracStr(q,4)).join(', ');
  const diagram = {type:'numberLineDots', values:quarters.map(q=>q/4)};
  const variant = pick(['count','longest','shortest','difference']);
  const context = 'A class measured pencil lengths in inches: '+N(listStr)+'.';
  if(variant==='count') return { isEquation:false, prompt:context+' How many pencils were measured?', type:'number', answer:count, explanation:'There are '+count+' measurements listed.', diagram };
  const max=quarters[quarters.length-1], min=quarters[0];
  if(variant==='longest') return { isEquation:false, prompt:context+' What is the length of the longest pencil (in inches)?', type:'text', placeholder:'e.g. 4 1/4',
    check:(input)=>answerMatchesFraction(input, max, 4), answer:fracStr(max,4), explanation:'The longest pencil is '+fracStr(max,4)+' inches.', diagram };
  if(variant==='shortest') return { isEquation:false, prompt:context+' What is the length of the shortest pencil (in inches)?', type:'text', placeholder:'e.g. 2 1/2',
    check:(input)=>answerMatchesFraction(input, min, 4), answer:fracStr(min,4), explanation:'The shortest pencil is '+fracStr(min,4)+' inches.', diagram };
  return { isEquation:false, prompt:context+' What is the difference between the longest and shortest pencil (in inches)?', type:'text', placeholder:'e.g. 1 1/4',
    check:(input)=>answerMatchesFraction(input, max-min, 4), answer:fracStr(max-min,4), explanation:fracStr(max,4)+' - '+fracStr(min,4)+' = '+fracStr(max-min,4)+' inches.', diagram };
}

function genNumberPatterns(){

    const start = randInt(2,25), step = randInt(2,9);
    const terms = [start, start+step, start+2*step, start+3*step];
    const next = start+4*step;
    return { isEquation:false, prompt:'What is the next number in this pattern? '+N(terms.join(', ')+', ?'),
      type:'number', answer:next, explanation:'Each number increases by '+step+', so the next number is '+terms[3]+' + '+step+' = '+next+'.', diagram:{type:'numberLineDots', values:terms} };
  }
  const start = randInt(1,4), ratio = pick([2,3]);
  const terms = [start, start*ratio, start*ratio*ratio, start*ratio*ratio*ratio];
  const next = terms[3]*ratio;
  return { isEquation:false, prompt:'What is the next number in this pattern? '+N(terms.join(', ')+', ?'),
    type:'number', answer:next, explanation:'Each number is multiplied by '+ratio+', so the next number is '+terms[3]+' × '+ratio+' = '+next+'.', diagram:{type:'numberLineDots', values:terms} };
}
function genSumDiffPuzzle(){

const PYTHAG_TRIPLES = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25],[20,21,29],[9,40,41],[12,16,20]];
function genPythagoreanTheorem(){
  const [a,b,c] = pick(PYTHAG_TRIPLES); const k=randInt(1,3); const A=a*k,B=b*k,C=c*k;
  if(Math.random()<0.5) return { isEquation:false, prompt:'A right triangle has legs of '+N(A)+' and '+N(B)+'. What is the length of the hypotenuse?', type:'number', answer:C,
    explanation:'√('+A+'² + '+B+'²) = √('+(A*A)+' + '+(B*B)+') = '+C+'.', diagram:{type:'rightTriangle', a:A, b:B, unknown:'c'} };
  return { isEquation:false, prompt:'A right triangle has a hypotenuse of '+N(C)+' and one leg of '+N(A)+'. What is the length of the other leg?', type:'number', answer:B,
    explanation:'√('+C+'² - '+A+'²) = √('+(C*C)+' - '+(A*A)+') = '+B+'.', diagram:{type:'rightTriangle', a:A, c:C, unknown:'b'} };
}
function genCircleAreaCircumference(){
  const r=randInt(2,12);
  if(Math.random()<0.5) return { isEquation:false, prompt:'A circle has a radius of '+N(r+' cm')+'. What is its area in terms of π? (give just the coefficient — e.g. answer 16 for 16π)', type:'number', answer:r*r,
    explanation:'Area = πr² = π×'+r+'² = '+(r*r)+'π cm².', diagram:{type:'circle', r} };
  return { isEquation:false, prompt:'A circle has a radius of '+N(r+' cm')+'. What is its circumference in terms of π? (give just the coefficient — e.g. answer 10 for 10π)', type:'number', answer:2*r,

}
function genSurfaceAreaPrism(){
  const l=randInt(2,10), w=randInt(2,10), h=randInt(2,10); const sa=2*(l*w+l*h+w*h);

    explanation:'2×('+l+'×'+w+' + '+l+'×'+h+' + '+w+'×'+h+') = 2×('+(l*w)+' + '+(l*h)+' + '+(w*h)+') = '+sa+' cm².', diagram:{type:'rectDims', w:l, h:w, depth:h} };

function genCompoundProbability(){

function termStr(coef, varStr){ if(coef===0) return ''; return (coef>0?' + ':' - ')+Math.abs(coef)+varStr; }
function genQuadraticFactoring(){
  let p=randInt(-9,9); if(p===0) p=1; let q=randInt(-9,9); if(q===0) q=-1;
  const b=-(p+q), c=p*q;
  return { isEquation:true, prompt:'Solve for x: x²'+termStr(b,'x')+termStr(c,'')+' = 0. (Enter the larger solution.)', type:'number', answer:Math.max(p,q),
    explanation:'x²'+termStr(b,'x')+termStr(c,'')+' = (x - '+p+')(x - '+q+'), so x = '+p+' or x = '+q+'; the larger is '+Math.max(p,q)+'.', diagram:{type:'balanceScale'} };
}
function genSystemsOfEquations(){
  let x,y,a1,b1,a2,b2;
  do{ x=randInt(-6,10); y=randInt(-6,10); a1=randInt(1,5); b1=randInt(1,5); a2=randInt(1,5); b2=randInt(1,5); } while(a1*b2-a2*b1===0);
  const c1=a1*x+b1*y, c2=a2*x+b2*y;
  return { isEquation:true, prompt:'Solve the system: '+a1+'x + '+b1+'y = '+c1+' and '+a2+'x + '+b2+'y = '+c2+'. What is x?', type:'number', answer:x,
    explanation:'Solving the system gives x = '+x+', y = '+y+'.', diagram:{type:'balanceScale'} };
}
function genFunctionEvaluation(){
  const a=randInt(1,5), b=randInt(-5,5), c=randInt(-10,10), n=randInt(-4,6);
  return { isEquation:true, prompt:'If f(x) = '+a+'x²'+termStr(b,'x')+termStr(c,'')+', what is f('+n+')?', type:'number', answer:a*n*n+b*n+c,
    explanation:a+'×'+n+'² '+(b>=0?'+ ':'- ')+Math.abs(b)+'×'+n+' '+(c>=0?'+ ':'- ')+Math.abs(c)+' = '+(a*n*n+b*n+c)+'.' };
}
function genExponentialGrowth(){
  const P=randInt(2,20)*10, r=pick([2,3]), Y=randInt(2,4);
  return { isEquation:false, prompt:'A population starts at '+N(P)+' and multiplies by '+N(r)+' every year. What will the population be after '+N(Y)+' years?', type:'number', answer:P*Math.pow(r,Y),
    explanation:P+' × '+r+'^'+Y+' = '+fmt(P*Math.pow(r,Y))+'.' };

function genPolynomialSimplify(){
  const a1=randInt(1,6), a2=randInt(1,6), b1=randInt(-8,8), b2=randInt(-8,8), c1=randInt(-10,10), c2=randInt(-10,10);
  const askX2 = Math.random()<0.5;
  return { isEquation:true, prompt:'Simplify: ('+a1+'x²'+termStr(b1,'x')+termStr(c1,'')+') + ('+a2+'x²'+termStr(b2,'x')+termStr(c2,'')+'). What is the '+(askX2?'coefficient of x²':'constant term')+'?',
    type:'number', answer: askX2?a1+a2:c1+c2, explanation:'Combine like terms across both polynomials.' };
}
function genQuadraticWordPuzzle(){

}
function genSystemWordPuzzle(){
  const A=randInt(8,15), c=randInt(3,10), nAdult=randInt(1,4), nChild=randInt(1,4);
  const T = A*nAdult + c*nChild;
  return { isEquation:false, prompt:'Adult movie tickets cost $'+N(A)+' each. A family bought '+N(nAdult)+' adult tickets and '+N(nChild)+' child tickets for a total of $'+N(T)+'. How much does one child ticket cost (in dollars)?', type:'number', answer:c,
    explanation:'($'+T+' - '+nAdult+'×$'+A+') ÷ '+nChild+' = $'+c+'.', diagram:{type:'balanceScale'} };
}
function genTrigRatios(){
  const [a,b,c] = pick(PYTHAG_TRIPLES); const ratio = pick(['sin','cos','tan']);
  let num,den,desc;
  if(ratio==='sin'){ num=a; den=c; desc='sin θ (opposite/hypotenuse)'; }
  else if(ratio==='cos'){ num=b; den=c; desc='cos θ (adjacent/hypotenuse)'; }
  else { num=a; den=b; desc='tan θ (opposite/adjacent)'; }
  return { isEquation:false, prompt:'In a right triangle with legs '+N(a)+' and '+N(b)+' and hypotenuse '+N(c)+', the angle θ is opposite the side of length '+N(a)+'. What is '+desc+'? (fraction, lowest terms)', type:'text', placeholder:'e.g. 3/5',
    check:(input)=>answerMatchesFraction(input, num, den), answer:fracStr(num,den), explanation:desc+' = '+num+'/'+den+' = '+fracStr(num,den)+'.', diagram:{type:'rightTriangle', a, b, c} };
}
function genDistanceMidpointSlope(){
  const variant = pick(['slope','midpoint','distance']);
  if(variant==='slope'){ const dx=randInt(1,6); let slope=randInt(-5,5); if(slope===0) slope=1; const dy=slope*dx;
    const x1=randInt(-8,4), y1=randInt(-8,8); const x2=x1+dx, y2=y1+dy;
    return { isEquation:false, prompt:'What is the slope of the line through ('+x1+', '+y1+') and ('+x2+', '+y2+')?', type:'number', answer:slope, explanation:'slope = ('+y2+' - '+y1+') ÷ ('+x2+' - '+x1+') = '+dy+'/'+dx+' = '+slope+'.', diagram:{type:'coordPoints', points:[[x1,y1],[x2,y2]], connect:true} }; }
  if(variant==='midpoint'){ const dx=randInt(2,10), dy=randInt(2,10); const Mx=randInt(-6,6);
    const x1=Mx-dx, x2=Mx+dx; const y1=randInt(-6,6), y2=y1+2*dy;
    return { isEquation:false, prompt:'What is the x-coordinate of the midpoint of the segment from ('+x1+', '+y1+') to ('+x2+', '+y2+')?', type:'number', answer:Mx, explanation:'Midpoint x = ('+x1+' + '+x2+') ÷ 2 = '+Mx+'.', diagram:{type:'coordPoints', points:[[x1,y1],[x2,y2]], connect:true} }; }
  const [dx,dy,dist] = pick(PYTHAG_TRIPLES); const x1=randInt(-6,6), y1=randInt(-6,6); const x2=x1+dx, y2=y1+dy;
  return { isEquation:false, prompt:'What is the distance between ('+x1+', '+y1+') and ('+x2+', '+y2+')?', type:'number', answer:dist,
    explanation:'√(('+dx+')² + ('+dy+')²) = √('+(dx*dx)+' + '+(dy*dy)+') = '+dist+'.', diagram:{type:'coordPoints', points:[[x1,y1],[x2,y2]], connect:true} };
}
function genSimilarTriangles(){
  const a=randInt(2,10), b=randInt(2,10), k=randInt(2,5); const d=a*k, EF=b*k;

function genGeometryChallenge(){

  return { isEquation:false, prompt:'What is the sum of the interior angles (in degrees) of a polygon with '+N(N_)+' sides?', type:'number', answer:(N_-2)*180,

function factorial(n){ let f=1; for(let i=2;i<=n;i++) f*=i; return f; }
function nCr(n,r){ return Math.round(factorial(n)/(factorial(r)*factorial(n-r))); }
function genModularArithmetic(){
  const a=randInt(15,99), m=pick([3,4,5,6,7,8,9,11,12]);
  return { isEquation:true, prompt:'What is '+a+' mod '+m+'? (the remainder when '+a+' is divided by '+m+')', type:'number', answer:a%m, explanation:a+' ÷ '+m+' = '+Math.floor(a/m)+' remainder '+(a%m)+'.' };
}

  const n=randInt(4,8), r=randInt(2,4>n?n:4);
  let perm=1; for(let i=0;i<r;i++) perm*=(n-i);
  return { isEquation:false, prompt:'How many ways can '+N(r)+' people be arranged in a line, chosen from a group of '+N(n)+'? (order matters)', type:'number', answer:perm,

}

  const first=randInt(1,10), diff=randInt(1,6), terms=randInt(4,10); const last=first+diff*(terms-1);

    explanation:'Sum = n×(first+last)/2 = '+terms+'×('+first+'+'+last+')/2 = '+(terms*(first+last)/2)+'.', diagram:{type:'numberLineDots', values:seq} };
}

/* Turns one bank entry into a problem object. Bank items with `choices` become
   multiple-choice; items with `accept` become short-answer text (checked
   case-insensitively against any accepted spelling). */
function bankProblem(item){
  if(item.choices){
    return { isEquation:false, type:'choice', prompt:item.q, choices:shuffle(item.choices.slice()), answer:item.a, explanation:item.exp };
  }
  return { isEquation:false, type:'text', prompt:item.q, placeholder:item.placeholder||'Type your answer',
    check:(input)=> (item.accept||[item.a]).some(acc=> String(input).trim().toLowerCase()===String(acc).toLowerCase()),
    answer:item.a, explanation:item.exp };
}

function genSimpleMachinesMath(){
  const loadArm = randInt(2,10), k = randInt(2,6), effortArm = loadArm*k;
  return { isEquation:false, type:'number',
    prompt:'A lever has an effort arm of '+N(effortArm+' cm')+' and a load arm of '+N(loadArm+' cm')+'. What is its mechanical advantage?',
    answer:k, explanation:'Mechanical advantage = effort arm ÷ load arm = '+effortArm+' ÷ '+loadArm+' = '+k+'.' };
}
function genStatesMatterEnergy(){
  const c = randInt(-4,20)*5; // multiples of 5, from -20 to 100
  const f = c*9/5+32;
  return { isEquation:true, type:'number',
    prompt:'Convert '+N(c+'°C')+' to Fahrenheit using F = (C × 9/5) + 32. What is the temperature in °F?',
    answer:f, explanation:'('+c+' × 9/5) + 32 = '+(c*9/5)+' + 32 = '+f+'°F.' };
}
function genForcesMotion(){
  if(Math.random()<0.5){
    const time=randInt(2,10), speed=randInt(5,60), distance=speed*time;
    return { isEquation:false, type:'number',
      prompt:'A car travels '+N(distance+' km')+' in '+N(time+' hours')+'. What is its speed in km/h? (speed = distance ÷ time)',
      answer:speed, explanation:distance+' ÷ '+time+' = '+speed+' km/h.' };
  }
  const mass=randInt(2,20), accel=randInt(2,10), force=mass*accel;
  return { isEquation:true, type:'number',
    prompt:'An object with a mass of '+N(mass+' kg')+' accelerates at '+N(accel+' m/s²')+'. What force (in Newtons) is needed? (F = m × a)',
    answer:force, explanation:mass+' × '+accel+' = '+force+' N.' };
}
const MOLAR_MASSES = [
  {name:'water (H₂O)', mass:18}, {name:'carbon dioxide (CO₂)', mass:44}, {name:'sodium chloride (NaCl)', mass:58},
  {name:'oxygen gas (O₂)', mass:32}, {name:'methane (CH₄)', mass:16}, {name:'ammonia (NH₃)', mass:17}
];
function genStoichiometryBasics(){
  const compound = pick(MOLAR_MASSES), moles = randInt(2,10), mass = moles*compound.mass;
  return { isEquation:false, type:'number',
    prompt:'The molar mass of '+compound.name+' is '+N(compound.mass+' g/mol')+'. How many moles are in '+N(mass+' g')+' of it? (moles = mass ÷ molar mass)',
    answer:moles, explanation:mass+' ÷ '+compound.mass+' = '+moles+' moles.' };
}
function genKinematics(){
  if(Math.random()<0.5){
    const v1=randInt(0,10), t=randInt(2,10), a=randInt(1,8), v2=v1+a*t;
    return { isEquation:true, type:'number',
      prompt:'An object speeds up from '+N(v1+' m/s')+' to '+N(v2+' m/s')+' in '+N(t+' seconds')+'. What is its acceleration in m/s²? (a = Δv ÷ t)',
      answer:a, explanation:'('+v2+' - '+v1+') ÷ '+t+' = '+a+' m/s².' };
  }
  const time=randInt(2,10), speed=randInt(5,40), distance=speed*time;
  return { isEquation:false, type:'number',
    prompt:'An object travels '+N(distance+' m')+' in '+N(time+' seconds')+'. What is its average speed in m/s?',
    answer:speed, explanation:distance+' ÷ '+time+' = '+speed+' m/s.' };
}
function genForcesNewtonsLaws(){
  const accel = randInt(2,10);
  if(Math.random()<0.5){ const mass=randInt(2,20), force=mass*accel;
    return { isEquation:true, type:'number', prompt:'A '+N(mass+' kg')+' object accelerates at '+N(accel+' m/s²')+'. What net force (in N) is acting on it? (F = m × a)', answer:force, explanation:mass+' × '+accel+' = '+force+' N.' }; }
  const rawForce=randInt(10,200), mass=Math.round(rawForce/accel), forceClean=mass*accel;
  return { isEquation:true, type:'number', prompt:'A net force of '+N(forceClean+' N')+' causes an object to accelerate at '+N(accel+' m/s²')+'. What is the mass of the object in kg? (m = F ÷ a)', answer:mass, explanation:forceClean+' ÷ '+accel+' = '+mass+' kg.' };
}
function genEnergyWorkPower(){
  if(Math.random()<0.5){
    const force=randInt(5,50), distance=randInt(2,20), work=force*distance;
    return { isEquation:true, type:'number', prompt:'A force of '+N(force+' N')+' moves an object '+N(distance+' m')+'. How much work (in Joules) is done? (W = F × d)', answer:work, explanation:force+' × '+distance+' = '+work+' J.' };
  }
  const rawWork=randInt(10,500), time=randInt(2,20), power=Math.round(rawWork/time), workClean=power*time;
  return { isEquation:true, type:'number', prompt:N(workClean+' J')+' of work is done in '+N(time+' seconds')+'. What is the power in Watts? (P = W ÷ t)', answer:power, explanation:workClean+' ÷ '+time+' = '+power+' W.' };
}

function hashStr(s){ let h=0; for(let i=0;i<String(s).length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function avatarFor(profile){
  if(profile && profile.avatarId){ const p=AVATAR_PRESETS.find(a=>a.id===profile.avatarId); if(p) return p; }
  return AVATAR_PRESETS[hashStr((profile&&profile.id)||'x') % AVATAR_PRESETS.length];
}

function examStyleFor(subtopic, band, subject){
  const strands = strandsFor(subject, band);
  const styleMap = examStyleMapFor(subject);
  for(const s of Object.values(strands)){
    if((s.advanced||[]).includes(subtopic)) return styleMap[band].advanced;
    if(s.subtopics.includes(subtopic)) return styleMap[band].core;
  }
  return '';
}

/* ============== olympiad syllabus (4 phases, ~16 weeks, then repeats Phase 4) ============== */
const PHASES = [
  { name:'Core Practice', tagline:'Build rock-solid grade-level fundamentals across all three strands.', weeks:[1,4] },
  { name:'Olympiad Foundations', tagline:'Layer in patterns, logic puzzles, and non-routine problems.', weeks:[5,8] },
  { name:'Olympiad Practice', tagline:'Mixed, multi-step challenge problems at competition difficulty.', weeks:[9,12] },
  { name:'Mock Competition', tagline:'Full timed rounds mirroring real Olympiad-style rounds.', weeks:[13,99] }
];
/* Day N stays the active day until every one of its sessions is finished —
   no matter how much real time passes — so a day is never lost, and the
   next day unlocks the instant the current one is complete. Week/phase in
   the Olympiad syllabus are driven by how many days have actually been
   completed, not by calendar time elapsed. */
function currentWeekNumber(data){ return Math.max(1, Math.ceil((data.currentDay||1)/7)); }
function currentPhaseIndex(data){ const w=currentWeekNumber(data); if(w<=4) return 0; if(w<=8) return 1; if(w<=12) return 2; return 3; }

/* ============== persistence ==============
   Each learner has ONE profile record (name, avatar, a grade PER SUBJECT —
   a kid can be doing 8th-grade math and 6th-grade science at once), and ONE
   progress record split into independent .math / .science slices, so the
   two subjects never share a day-pointer, streak, or topic stats. */
function loadProfiles(){ try{ return JSON.parse(localStorage.getItem('yugi_profiles')||'[]'); }catch(e){ return []; } }
function saveProfiles(list){ localStorage.setItem('yugi_profiles', JSON.stringify(list)); }
function defaultSubjectData(){ return { days:{}, topicStats:{}, currentDay:1, band:null }; }
function normalizeSubjectData(d){
  if(!d.days) d.days = {};
  if(!d.currentDay) d.currentDay = 1;
  if(!d.topicStats) d.topicStats = {};
  return d;
}
function loadFullData(id){
  try{
    const raw = localStorage.getItem('yugi_data_'+id);
    const full = raw ? JSON.parse(raw) : {};
    full.math = normalizeSubjectData(full.math || defaultSubjectData());
    full.science = normalizeSubjectData(full.science || defaultSubjectData());
    return full;
  }catch(e){ return { math:defaultSubjectData(), science:defaultSubjectData() }; }
}
function saveFullData(id, full){ localStorage.setItem('yugi_data_'+id, JSON.stringify(full)); }
/* loadData/saveData work on ONE subject's slice, so the rest of the app
   (which was written before subjects existed) barely had to change: it just
   passes the same slice object it got from loadData back into saveData. */
function loadData(id, subject){ return loadFullData(id)[subject]; }
function saveData(id, data){
  const full = loadFullData(id);
  full[state.subject] = data;
  saveFullData(id, full);
}
/* Resets day-tracking if the learner's grade band (for this subject) changed
   (their old days' strand keys wouldn't match the new package) — topicStats
   is kept either way. */
function ensureBand(data, band){
  if(data.band !== band){ data.days = {}; data.currentDay = 1; data.band = band; }
}
function ensureDay(data, subject, band, dayNum){
  if(!data.days[dayNum]){
    const day={ learnDoubts:[], studied:[], strandSeconds:{} }; Object.keys(strandsFor(subject, band)).forEach(k=>{ day[k]={done:false}; });
    data.days[dayNum]=day;
  }
  if(!data.days[dayNum].learnDoubts) data.days[dayNum].learnDoubts = [];
  if(!data.days[dayNum].studied) data.days[dayNum].studied = [];
  if(!data.days[dayNum].strandSeconds) data.days[dayNum].strandSeconds = {};
  return data.days[dayNum];
}
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  if(h>0) return h+'h '+m+'m';
  if(m>0) return m+'m';
  return sec>0 ? '<1m' : '0m';
}
function markStudied(subject, band, strandKey){
  const profile = currentProfile();
  if(!profile) return;
  const data = currentData();
  ensureBand(data, band);
  const dayNum = data.currentDay||1;
  const day = ensureDay(data, subject, band, dayNum);
  if(!day.studied.includes(strandKey)) day.studied.push(strandKey);
  saveData(profile.id, data);
}
function findStrandForSubtopic(strands, subtopic){
  for(const s of Object.values(strands)){
    if(s.subtopics.includes(subtopic) || (s.advanced||[]).includes(subtopic)) return s;
  }
  return null;
}
function allDone(day, subject, band){ if(!day) return false; return Object.keys(strandsFor(subject, band)).every(k=> day[k] && day[k].done); }
function computeStreak(data, subject, band){ let count=0, d=1; while(data.days[d] && allDone(data.days[d], subject, band)){ count++; d++; } return count; }
/* Keeps score/done/assisted forever (tiny), but only keeps the heavier
   per-problem review text for the most recent N completed days. */
function pruneOldReviews(data, keepLastN){
  const dayNums = Object.keys(data.days).map(Number).sort((a,b)=>a-b);
  const cutoff = dayNums.length - keepLastN;
  if(cutoff<=0) return;
  dayNums.slice(0, cutoff).forEach(d=>{
    Object.keys(data.days[d]).forEach(k=>{ if(data.days[d][k] && data.days[d][k].review) delete data.days[d][k].review; });
  });
}

/* ============== persona & progress trends ============== */
function subtopicTrend(stats){
  if(!stats || stats.attempted<6) return null;
  const log = stats.log||[]; if(log.length<6) return null;
  const half = Math.floor(log.length/2);
  const older = log.slice(0,half), recent = log.slice(half);
  const oldAcc = older.reduce((a,b)=>a+b,0)/older.length;
  const newAcc = recent.reduce((a,b)=>a+b,0)/recent.length;
  const diff = newAcc-oldAcc;
  if(diff>0.12) return 'up';
  if(diff<-0.12) return 'down';
  return 'flat';
}
function masteryTier(stats){
  if(!stats || stats.attempted<5) return {label:'Just starting', tone:'new'};
  const acc = stats.correct/stats.attempted;
  if(acc>=0.85) return {label:'Mastered', tone:'good'};
  if(acc>=0.65) return {label:'Developing', tone:'mid'};
  return {label:'Needs practice', tone:'low'};
}
function personaFor(data, subject, band){
  const strands = strandsFor(subject, band);
  const subtopics = Object.values(strands).flatMap(s=>s.subtopics.concat(s.advanced||[]));
  let mastered=0, totalAttempted=0, totalCorrect=0;
  subtopics.forEach(st=>{ const s=data.topicStats[st]; if(s){ totalAttempted+=s.attempted; totalCorrect+=s.correct; if(s.attempted>=5 && s.correct/s.attempted>=0.85) mastered++; } });
  let title;
  if(totalAttempted<10) title='Rookie';
  else if(mastered<=2) title='Bronze Olympian';
  else if(mastered<=6) title='Silver Olympian';
  else if(mastered<=11) title='Gold Olympian';
  else title='Olympiad Champion';
  const overallAcc = totalAttempted>0 ? Math.round(100*totalCorrect/totalAttempted) : null;
  return { title, mastered, totalAttempted, overallAcc, totalTopics:subtopics.length };
}
function strandRating(data, strand){
  const subs = strand.subtopics.concat(strand.advanced||[]);
  let correct=0, attempted=0;
  subs.forEach(st=>{ const s=data.topicStats[st]; if(s){ correct+=s.correct; attempted+=s.attempted; } });
  if(attempted<5) return {label:'New', acc:null};
  const acc = Math.round(100*correct/attempted);
  const label = acc>=85?'Gold':acc>=65?'Silver':'Bronze';
  return {label, acc};
}
function strandSessionSeries(data, strandKey, limit){
  limit = limit||8;
  const dayNums = Object.keys(data.days).map(Number).filter(d=>data.days[d][strandKey] && data.days[d][strandKey].done).sort((a,b)=>a-b);
  return dayNums.slice(-limit).map(d=>({ day:d, pct: Math.round(100*data.days[d][strandKey].score/data.days[d][strandKey].total) }));
}
function trendLabel(series){
  if(series.length<2) return {text:'Not enough sessions yet', tone:'flat'};
  const half = Math.floor(series.length/2);
  const firstAvg = series.slice(0,half).reduce((a,p)=>a+p.pct,0)/half;
  const secondAvg = series.slice(half).reduce((a,p)=>a+p.pct,0)/(series.length-half);
  const diff = Math.round(secondAvg-firstAvg);
  if(diff>=5) return {text:'▲ +'+diff+' pts — improving', tone:'up'};
  if(diff<=-5) return {text:'▼ '+diff+' pts — dip', tone:'down'};
  return {text:'– holding steady', tone:'flat'};
}
function sparklineSvg(series, colorVar){
  if(series.length===0) return '<div style="font-size:13px;color:var(--ink-faint);padding:22px 0;">No completed sessions yet.</div>';
  const w=240, h=64, pad=8;
  const pts = series.map((p,i)=>{
    const x = series.length===1 ? w/2 : pad + (i/(series.length-1))*(w-2*pad);
    const y = pad + (1-p.pct/100)*(h-2*pad);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="overflow:visible;">'
    + '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--grid)" stroke-width="1"/>'
    + '<path d="'+path+'" fill="none" stroke="'+colorVar+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    + pts.map((p,i)=> i===pts.length-1 ? '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+colorVar+'"/>' : '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2" fill="'+colorVar+'" opacity="0.5"/>').join('')
    + '</svg>';
}

/* ============== problem diagrams ==============
   Schematic (not-to-scale) SVGs built from each problem's OWN given values.
   They only ever show information already stated in the prompt — never the
   answer being solved for — so they support the problem without spoiling it. */
function svgOpen(vb, h){ return '<svg viewBox="'+vb+'" width="100%" height="'+(h||140)+'" style="overflow:visible;">'; }
function svgTxt(x,y,txt,opts){
  opts=opts||{};
  return '<text x="'+x+'" y="'+y+'" font-size="'+(opts.size||14)+'" text-anchor="'+(opts.anchor||'middle')+'" '
    +'fill="'+(opts.color||'var(--ink)')+'" font-family="'+(opts.mono===false?"'Fredoka'":"'IBM Plex Mono'")+'" font-weight="600">'+esc(String(txt))+'</text>';
}

function diagRectDims(spec){
  const bx=40, by=24, bw=150, bh=76;
  let extra = spec.depth!==undefined ? svgTxt(bx+bw/2, by+bh+34, 'depth: '+spec.depth, {size:12, color:'var(--ink-faint)', mono:false}) : '';
  return svgOpen('0 0 230 150', 150)
    + '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5" rx="3"/>'
    + svgTxt(bx+bw/2, by-8, spec.w, {size:14})
    + svgTxt(bx-10, by+bh/2+5, spec.h, {size:14, anchor:'end'})
    + extra
    + '</svg>';
}
function diagRightTriangle(spec){
  const x0=30,y0=110, x1=190,y1=110, x2=30,y2=20;
  const labelA = spec.unknown==='a' ? '?' : spec.a;
  const labelB = spec.unknown==='b' ? '?' : spec.b;
  const labelC = spec.unknown==='c' ? '?' : spec.c;
  return svgOpen('0 0 220 140', 140)
    + '<polygon points="'+x0+','+y0+' '+x1+','+y1+' '+x2+','+y2+'" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round"/>'
    + '<rect x="'+x0+'" y="'+(y0-14)+'" width="14" height="14" fill="none" stroke="var(--c)" stroke-width="1.5"/>'
    + svgTxt((x0+x1)/2, y0+22, labelB, {size:14})
    + svgTxt(x0-12, (y0+y2)/2+5, labelA, {size:14, anchor:'end'})
    + svgTxt((x1+x2)/2+18, (y1+y2)/2-8, labelC, {size:14})
    + '</svg>';
}
function diagCircle(spec){
  const cx=110, cy=75, r=55;
  let inner = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5"/>';
  if(spec.arcs){
    for(let i=0;i<spec.arcs;i++){
      const ang = (i/spec.arcs)*2*Math.PI - Math.PI/2;
      const px = cx+r*Math.cos(ang), py = cy+r*Math.sin(ang);
      inner += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.5" fill="var(--c)"/>';
    }
  } else {
    inner += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" stroke="var(--c)" stroke-width="2"/>'
      + svgTxt(cx+r/2, cy-8, spec.r, {size:13});
  }
  return svgOpen('0 0 220 150', 150) + inner + '</svg>';
}
function diagAngle(spec){
  const ox=40, oy=120, len=150;
  const rad = spec.deg*Math.PI/180;
  const x2 = ox+len*Math.cos(-rad), y2 = oy+len*Math.sin(-rad);
  const arcR = 34;
  const largeArc = spec.deg>180?1:0;
  const ax = ox+arcR, ay=oy;
  const bx = ox+arcR*Math.cos(-rad), by = oy+arcR*Math.sin(-rad);
  return svgOpen('0 0 220 140', 140)
    + '<line x1="'+ox+'" y1="'+oy+'" x2="'+(ox+len)+'" y2="'+oy+'" stroke="var(--c)" stroke-width="2.5"/>'
    + '<line x1="'+ox+'" y1="'+oy+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--c)" stroke-width="2.5"/>'
    + '<path d="M '+ax.toFixed(1)+' '+ay.toFixed(1)+' A '+arcR+' '+arcR+' 0 '+largeArc+' 0 '+bx.toFixed(1)+' '+by.toFixed(1)+'" fill="none" stroke="var(--c)" stroke-width="1.5"/>'

function diagPolygon(spec){
  const cx=110, cy=75, r=55, n=spec.sides||4;
  let pts=[];
  for(let i=0;i<n;i++){ const ang=(i/n)*2*Math.PI - Math.PI/2; pts.push((cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1)); }
  return svgOpen('0 0 220 150', 150)
    + '<polygon points="'+pts.join(' ')+'" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round"/>'
    + '</svg>';
}
function diagFractionBar(spec){
  const d=spec.d, W=220, H=44, x0=10, y0=20, cw=(W-2*x0)/d;
  const colors = spec.colors || ['var(--c)'];
  let rects='';
  let filled=0;
  (spec.shaded||[]).forEach((n,gi)=>{
    for(let i=0;i<n;i++){
      rects += '<rect x="'+(x0+(filled+i)*cw).toFixed(1)+'" y="'+y0+'" width="'+cw.toFixed(1)+'" height="'+H+'" fill="'+(colors[gi]||colors[0])+'" opacity="'+(gi===0?1:0.55)+'"/>';
    }
    filled+=n;
  });
  let cells='';
  for(let i=0;i<=d;i++){ cells += '<line x1="'+(x0+i*cw).toFixed(1)+'" y1="'+y0+'" x2="'+(x0+i*cw).toFixed(1)+'" y2="'+(y0+H)+'" stroke="var(--ink)" stroke-width="1" opacity="0.35"/>'; }

    + '<rect x="'+x0+'" y="'+y0+'" width="'+(W-2*x0)+'" height="'+H+'" fill="none" stroke="var(--c)" stroke-width="2"/>'

    + '</svg>';
}
function diagPercentBar(spec){
  const W=220, H=34, x0=10, y0=14, pct=spec.pct;

    + '<rect x="'+x0+'" y="'+y0+'" width="'+(W-2*x0)+'" height="'+H+'" fill="none" stroke="var(--c)" stroke-width="2"/>'
    + '<rect x="'+x0+'" y="'+y0+'" width="'+((W-2*x0)*pct/100).toFixed(1)+'" height="'+H+'" fill="var(--c-soft)"/>'
    + svgTxt(x0+2, y0+H+18, '0%', {size:11, anchor:'start', color:'var(--ink-faint)'})

function diagNumberLineDots(spec){
  const vals=spec.values, min=Math.min(...vals,spec.min!==undefined?spec.min:vals[0]), max=Math.max(...vals,spec.max!==undefined?spec.max:vals[vals.length-1]);
  const W=240, x0=16, x1=224, y=70;
  const range = (max-min)||1;
  const xOf = v => x0 + ((v-min)/range)*(x1-x0);
  let dots = vals.map(v=>'<circle cx="'+xOf(v).toFixed(1)+'" cy="'+y+'" r="5" fill="var(--c)"/>').join('');
  return svgOpen('0 0 240 100', 100)
    + '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--ink-faint)" stroke-width="1.5"/>'
    + dots
    + svgTxt(x0, y+24, min, {size:11, anchor:'start', color:'var(--ink-faint)'})

function diagSignedJump(spec){
  const start=spec.start, delta=spec.delta;

  const x0=16, x1=224, y=60, min=-span, max=span;
  const xOf = v => x0 + ((v-min)/(max-min))*(x1-x0);
  const sx = xOf(start), ex = xOf(start+delta);
  return svgOpen('0 0 240 100', 100)
    + '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--ink-faint)" stroke-width="1.5"/>'
    + '<line x1="'+x0+'" y1="'+y+'" x2="'+x0+'" y2="'+(y-4)+'" stroke="var(--ink-faint)"/>'
    + '<circle cx="'+sx.toFixed(1)+'" cy="'+y+'" r="5" fill="var(--c)"/>'

function diagCoordPoints(spec){

  const xOf = x => pad + ((x-minX)/(maxX-minX))*(W-2*pad);
  const yOf = y => H-pad - ((y-minY)/(maxY-minY))*(H-2*pad);
  const zx = xOf(0), zy = yOf(0);

function applyTheme(id){
  const root = document.documentElement;
  if(!root) return;
  const tokens = THEME_TOKENS[id];
  if(id && id!=='classic' && tokens){
    root.setAttribute('data-color-theme', id);
    THEME_VAR_NAMES.forEach(k=>{ if(tokens[k]!==undefined) root.style.setProperty(k, tokens[k]); });

   when neither the sample capability nor a saved API key is available
   (e.g. self-hosted outside Claude, no key added). */
const API_KEY_STORAGE = 'yugi_api_key';
function getApiKey(){ try{ return (localStorage.getItem(API_KEY_STORAGE)||'').trim(); }catch(e){ return ''; } }
function setApiKey(key){
  try{ if(key) localStorage.setItem(API_KEY_STORAGE, key); else localStorage.removeItem(API_KEY_STORAGE); }catch(e){}
  cachedSample = undefined; // force re-check on next hint request
}
async function callAnthropicDirect(turns, opts){
  const key = getApiKey();
  const messages = Array.isArray(turns) ? turns.map(t=>({role:t.role, content:t.content})) : [{role:'user', content:String(turns)}];
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:300, messages })
  });
  if(!res.ok){ let detail=''; try{ detail=await res.text(); }catch(e){} throw { code:'api_error', message:'Anthropic API error '+res.status+(detail?': '+detail:'') }; }
  const data = await res.json();
  const text = (data.content && data.content[0] && data.content[0].text) || '';
  if(opts && opts.onText) opts.onText({text});
  return { text };
}
let cachedSample; // undefined = not checked yet, null = unavailable, function = ready
async function getSample(){
  if(cachedSample !== undefined) return cachedSample;

    try{ const s = await window.claude.use('sample'); if(s){ cachedSample = s; return cachedSample; } }catch(e){}
  }
  if(getApiKey()){ cachedSample = callAnthropicDirect; return cachedSample; }
  cachedSample = null;
  return cachedSample;
}

/* Diagrams Claude can attach to a chat reply via the show_diagram tool, reusing the
   same schematic SVG renderer as practice problems. Inputs are clamped/coerced so a
   slightly-off tool call still renders something reasonable instead of crashing. */
function normalizeDiagramInput(input){
  if(!input || typeof input!=='object') return null;
  const clamp = (v,lo,hi)=>{ const n=Math.round(Number(v)); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : lo; };
  try{
    switch(input.type){
      case 'iconRow': return { type:'iconRow', n: clamp(input.n,2,12) };
      case 'fractionBar': {
        const d = clamp(input.d,1,12);
        return { type:'fractionBar', d, shaded:[clamp(input.shaded,0,d)] };
      }
      case 'percentBar': return { type:'percentBar', pct: clamp(input.pct,0,100) };
      case 'numberLineDots': {
        const values = Array.isArray(input.values) ? input.values.map(Number).filter(Number.isFinite).slice(0,8) : [];
        return values.length ? { type:'numberLineDots', values } : null;
      }
      case 'rectDims': return { type:'rectDims', w: input.w!=null?String(input.w):'?', h: input.h!=null?String(input.h):'?' };
      case 'circle': return { type:'circle', r: input.r!=null?String(input.r):'?' };
      case 'squareArea': return { type:'squareArea', area: input.area!=null?String(input.area):'?' };
      default: return null;
    }
  }catch(e){ return null; }
}
function buildDiagramTool(captureRef){
  return {
    name: 'show_diagram',
    description: 'Show one simple schematic diagram to help the student visualize the idea — a fraction bar, a percent bar, a number line with points marked, a row of icons for counting/grouping, a labeled rectangle, a circle, or a square with a given area. Only call this when a picture would truly help; skip it for purely verbal explanations. Call it at most once per reply.',
    inputSchema: {
      type:'object',
      properties:{
        type:{ type:'string', enum:['iconRow','fractionBar','percentBar','numberLineDots','rectDims','circle','squareArea'] },
        n:{ type:'number', description:'iconRow: how many icons (2-12).' },
        d:{ type:'number', description:'fractionBar: total equal parts (the denominator).' },
        shaded:{ type:'number', description:'fractionBar: how many parts to shade (the numerator).' },
        pct:{ type:'number', description:'percentBar: percent from 0 to 100.' },
        values:{ type:'array', items:{type:'number'}, description:'numberLineDots: the numbers to mark on the line.' },
        w:{ type:'number', description:'rectDims: width label.' },
        h:{ type:'number', description:'rectDims: height label.' },
        r:{ type:'number', description:'circle: radius label.' },
        area:{ type:'number', description:'squareArea: the area value to show.' }
      },
      required:['type']
    },
    execute: (input)=>{ captureRef.spec = normalizeDiagramInput(input); return { shown: !!captureRef.spec }; }
  };
}

/* Chat thread for hints and follow-up doubts on a problem. problem.chat holds the
   full turn history and is resent in full on every call since the sample capability
   has no memory. Turns marked hidden:true are real context sent to the model but never
   shown in the UI (e.g. the "give me a hint" system-style framing); turns instead show
   their `display` text when present, so a hidden turn's real question can still be
   echoed to the student via a sibling non-hidden turn with the same display text. */
function chatBubbleHtml(turn){
  const shown = turn.display!==undefined ? turn.display : turn.content;
  if(turn.role==='user') return '<div class="chat-bubble chat-user">'+esc(shown)+'</div>';
  let html = '<div class="chat-bubble chat-claude"><span class="hint-source">🤖 Claude</span>'+esc(shown)+'</div>';
  if(turn.diagram) html += '<div class="problem-diagram">'+renderDiagram(turn.diagram)+'</div>';
  if(turn.confirmed==='yes') html += '<div class="confirm-note good">✓ Confirmed — that made sense</div>';
  else if(turn.confirmed==='no') html += '<div class="confirm-note warn">🤔 Said this was still confusing</div>';
  return html;
}
function ensureChat(problem){ if(!problem.chat) problem.chat = []; }
function markAssisted(problem, label){
  problem.assisted = true;
  const btn = document.getElementById('help-btn');
  if(btn){ btn.disabled = true; btn.textContent = label || '✓ Assisted'; }
}
/* idSuffix lets the same chat UI be wired up for several problems shown on screen at
   once (e.g. one per lesson card in the Learn screen) without id collisions — the
   session screen (one problem visible at a time) just omits it. */
function renderHelpPanel(problem, aiAvailable, idSuffix){
  idSuffix = idSuffix || '';
  const panel = document.getElementById('help-panel'+idSuffix);
  if(!panel) return;
  const visibleTurns = (problem.chat||[]).filter(t=>!t.hidden);
  let html = visibleTurns.map(chatBubbleHtml).join('');
  const lastTurn = visibleTurns[visibleTurns.length-1];
  const needsConfirm = !!(lastTurn && lastTurn.role==='assistant' && !lastTurn.confirmed);
  if(needsConfirm){
    html += '<div class="confirm-row" id="confirm-row'+idSuffix+'">'+
      '<span class="confirm-label">Did that make sense?</span>'+
      '<button class="btn btn-ghost confirm-btn" data-confirm="yes">👍 Yes, got it</button>'+
      '<button class="btn btn-ghost confirm-btn" data-confirm="no">🤔 Still confused</button>'+
    '</div>';
  }
  if(aiAvailable){
    html += '<div class="chat-ask-row"><input type="text" id="chat-input'+idSuffix+'" placeholder="Ask a question..." autocomplete="off"><button class="btn btn-ghost" id="chat-send-btn'+idSuffix+'">Ask</button></div>';
  }
  panel.innerHTML = html;
  const inp = document.getElementById('chat-input'+idSuffix), send = document.getElementById('chat-send-btn'+idSuffix);
  if(inp && send){
    const submit = ()=> askFollowup(problem, idSuffix);
    send.addEventListener('click', submit);
    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
  }
  if(needsConfirm){
    const row = document.getElementById('confirm-row'+idSuffix);
    if(row) row.querySelectorAll('[data-confirm]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        lastTurn.confirmed = btn.getAttribute('data-confirm');
        if(idSuffix) persistLearnDoubt(problem);
        renderHelpPanel(problem, aiAvailable, idSuffix);
        if(lastTurn.confirmed==='no'){
          const i2 = document.getElementById('chat-input'+idSuffix);
          if(i2) i2.focus();
        }
      });
    });
  }
}
function openAskBox(problem, idSuffix){
  idSuffix = idSuffix || '';
  const panel = document.getElementById('help-panel'+idSuffix);
  if(!panel) return;
  ensureChat(problem);
  panel.hidden = false;
  renderHelpPanel(problem, true, idSuffix);
  const inp = document.getElementById('chat-input'+idSuffix);
  if(inp) inp.focus();
}
async function requestHint(problem, subject){
  const panel = document.getElementById('help-panel');
  const btn = document.getElementById('help-btn');
  if(!panel) return;
  ensureChat(problem);
  markAssisted(problem, '🤖 Asking Claude...');
  panel.hidden = false;
  if(problem.chat.length===0){
    const profile = currentProfile();
    const grade = profile && profile.grades && profile.grades[subject];
    problem.chat.push({ role:'user', content: buildHintPrompt(problem, grade), hidden:true });
  } else {
    const askText = 'Can you give me a hint for this problem?';
    problem.chat.push({ role:'user', content: askText, display: askText });
  }
  renderHelpPanel(problem, true);
  panel.insertAdjacentHTML('beforeend', '<div class="chat-bubble chat-claude" id="chat-pending"><span class="hint-source">🤖 Claude</span>Thinking…</div>');
  const sampleFn = await getSample();
  if(!sampleFn){
    const el=document.getElementById('chat-pending'); if(el) el.remove();
    problem.chat.push({ role:'assistant', content: CONCEPT_HELP[problem.subtopic]||'' });
    markAssisted(problem, '✓ Hint shown');
    renderHelpPanel(problem, true);
    return;
  }
  const diagramCapture = {};
  const onText = ({text})=>{ const el=document.getElementById('chat-pending'); if(el) el.innerHTML = '<span class="hint-source">🤖 Claude</span>'+esc(text); };
  let result;
  try{
    result = await sampleFn(problem.chat, { modelTier:'quick', tools:[buildDiagramTool(diagramCapture)], onText });
  }catch(e){
    try{ result = await sampleFn(problem.chat, { modelTier:'quick', onText }); }
    catch(e2){ result = null; }
  }
  problem.chat.push({ role:'assistant', content: (result && result.text) || CONCEPT_HELP[problem.subtopic] || '', diagram: diagramCapture.spec });
  markAssisted(problem, '✓ Hint shown');
  renderHelpPanel(problem, true);
}
/* Learn-screen doubts aren't tied to a saved assessment problem, so they'd
   otherwise vanish the moment the example regenerates or the page reloads.
   Persist them into today's day record so they show up in the Daily
   Learning Log too, just like doubts asked during a real session. */
function persistLearnDoubt(problem){
  const profile = currentProfile();
  const subject = state.subject;
  const grade = profile && profile.grades && profile.grades[subject];
  if(!grade) return;
  const band = bandForGrade(grade);
  const data = currentData();
  ensureBand(data, band);
  const dayNum = data.currentDay||1;
  const day = ensureDay(data, subject, band, dayNum);
  const doubts = (problem.chat||[]).filter(t=>!t.hidden);
  const existing = day.learnDoubts.find(e=>e.subtopic===problem.subtopic);
  if(existing){ existing.doubts = doubts; existing.prompt = problem.prompt; existing.isEquation = !!problem.isEquation; }
  else { day.learnDoubts.push({ subtopic: problem.subtopic, prompt: problem.prompt, isEquation: !!problem.isEquation, doubts }); }
  saveData(profile.id, data);
}
async function askFollowup(problem, idSuffix){
  idSuffix = idSuffix || '';
  const isLearnContext = !!idSuffix;
  const inp = document.getElementById('chat-input'+idSuffix);
  if(!inp) return;
  const question = inp.value.trim();
  if(!question) return;
  ensureChat(problem);
  markAssisted(problem);
  if(problem.chat.length===0){
    const profile = currentProfile();
    const subject = (state.session && state.session.subject) || state.subject;
    const grade = profile && profile.grades && profile.grades[subject];
    problem.chat.push({ role:'user', content: buildDoubtPrompt(problem, grade, question), display: question });
  } else {
    problem.chat.push({ role:'user', content: question+'\n\n(Reminder: still do not reveal the final answer — just help me understand the approach.)', display: question });
  }
  renderHelpPanel(problem, true, idSuffix);
  const panel = document.getElementById('help-panel'+idSuffix);
  panel.insertAdjacentHTML('beforeend', '<div class="chat-bubble chat-claude" id="chat-pending'+idSuffix+'"><span class="hint-source">🤖 Claude</span>Thinking…</div>');
  const sampleFn = await getSample();
  if(!sampleFn){
    const el=document.getElementById('chat-pending'+idSuffix); if(el) el.remove();
    problem.chat.push({ role:'assistant', content: "I can't reach Claude right now to answer that — try again in a bit, or ask a grown-up if you're stuck!" });
    if(isLearnContext) persistLearnDoubt(problem);
    renderHelpPanel(problem, true, idSuffix);
    return;
  }
  const diagramCapture = {};
  const onText = ({text})=>{ const el=document.getElementById('chat-pending'+idSuffix); if(el) el.innerHTML = '<span class="hint-source">🤖 Claude</span>'+esc(text); };
  let result, lastError;
  try{
    result = await sampleFn(problem.chat, { modelTier:'quick', tools:[buildDiagramTool(diagramCapture)], onText });
  }catch(e){
    lastError = e;
    try{ result = await sampleFn(problem.chat, { modelTier:'quick', onText }); lastError = null; }
    catch(e2){ lastError = e2; }
  }
  if(lastError){
    const code = lastError && lastError.code;
    const msg = code==='not_granted' ? "Claude AI hints aren't turned on for this session — ask a grown-up to allow it, or try the 💡 hint button instead."
      : code==='rate_limited' ? "Claude is a little busy right now — wait a few seconds and try asking again."
      : 'Sorry, I could not answer that just now. Try asking again.';
    problem.chat.push({ role:'assistant', content: (lastError && lastError.text) || msg });
  } else {
    problem.chat.push({ role:'assistant', content: (result && result.text) || 'Sorry, I am not sure about that one — try asking your teacher.', diagram: diagramCapture.spec });
  }
  if(isLearnContext) persistLearnDoubt(problem);
  renderHelpPanel(problem, true, idSuffix);
}

function accuracyFor(data, subtopics){
  let correct=0, attempted=0;
  subtopics.forEach(st=>{ const s=data.topicStats[st]; if(s){ correct+=s.correct; attempted+=s.attempted; } });
  return attempted>0 ? Math.round(100*correct/attempted) : null;
}
function dayTrail(data, subject, band){
  const strandKeys = Object.keys(strandsFor(subject, band));
  const frontier = data.currentDay||1;
  const start = Math.max(1, frontier-6);
  const trail=[];
  for(let d=start; d<=frontier; d++){
    const dayObj = data.days[d];
    const n = dayObj ? strandKeys.filter(k=>dayObj[k]&&dayObj[k].done).length : 0;
    trail.push({ day:d, n, total:strandKeys.length, isCurrent:d===frontier });
  }
  return trail;
}

/* ============== session ============== */
function pickSubtopicSequence(strand, data, dayNum){
  const unlocked = currentPhaseIndex(data)>=1 && strand.advanced ? strand.subtopics.concat(strand.advanced) : strand.subtopics;
  const subs = unlocked;
  const shift = dayNum % subs.length;
  const rotated = subs.slice(shift).concat(subs.slice(0,shift));
  const focusCount = Math.min(3, subs.length);
  const focus = rotated.slice(0,focusCount);
  const weights = focus.map(st=>{
    const s = data.topicStats[st];
    const acc = s && s.attempted>0 ? s.correct/s.attempted : 0.75;
    return 1 + (1-acc)*2;
  });
  const seq=[];
  for(let i=0;i<PROBLEMS_PER_SESSION;i++){
    let r = Math.random()*weights.reduce((a,b)=>a+b,0);
    let idx=0; for(;idx<weights.length;idx++){ r-=weights[idx]; if(r<=0) break; }
    seq.push(focus[Math.min(idx,focus.length-1)]);
  }
  return seq;
}
function startSession(strandKey){
  const profile = currentProfile();
  const subject = state.subject;
  const band = bandForGrade(profile.grades[subject]);
  const strand = strandsFor(subject, band)[strandKey];
  const data = currentData();
  ensureBand(data, band);
  const dayNum = data.currentDay||1;
  ensureDay(data, subject, band, dayNum);
  const wasDone = data.days[dayNum][strandKey].done;
  const seq = pickSubtopicSequence(strand, data, dayNum);
  const problems = seq.map(st=>{ const p = GENERATORS[st](); p.subtopic=st; return p; });
  state.session = { subject, strandKey, band, dayNum, problems, idx:0, correct:0, assisted:0, answered:0, timeLeft:SESSION_LENGTH_SEC, timerId:null, checked:false, wasDone, reviewLog:[] };
  state.screen='session';
  render();
  const timerEl = ()=>document.getElementById('timer-val');
  state.session.timerId = setInterval(()=>{
    state.session.timeLeft--;
    const el = timerEl();
    if(el){ el.textContent = fmtTime(state.session.timeLeft); if(state.session.timeLeft<=60) el.parentElement.classList.add('low'); }
    if(state.session.timeLeft<=0){ clearInterval(state.session.timerId); finishSession(); }
  },1000);
}
function fmtTime(sec){ sec=Math.max(0,sec); return Math.floor(sec/60)+':'+pad2(sec%60); }

    });
  });

}

function submitAnswer(rawInput){
  const sess = state.session;
  const problem = sess.problems[sess.idx];
  const strand = strandsFor(sess.subject, sess.band)[sess.strandKey];
  let isCorrect;
  if(problem.check){ isCorrect = problem.check(rawInput); }
  else if(problem.type==='choice'){ isCorrect = rawInput===problem.answer; }
  else { isCorrect = checkNumber(rawInput, problem.answer); }

  const wasAssisted = !!problem.assisted;
  sess.answered++;
  if(isCorrect && !wasAssisted) sess.correct++;
  if(wasAssisted) sess.assisted = (sess.assisted||0)+1;
  const data = currentData();
  const s = data.topicStats[problem.subtopic] || {correct:0, attempted:0, assisted:0, log:[]};
  s.attempted++;
  if(wasAssisted) s.assisted = (s.assisted||0)+1;
  if(isCorrect && !wasAssisted) s.correct++;
  s.log = s.log||[]; s.log.push((isCorrect && !wasAssisted)?1:0); if(s.log.length>30) s.log.shift();
  data.topicStats[problem.subtopic] = s;
  saveData(state.profileId, data);

  sess.reviewLog.push({
    subtopic: problem.subtopic, prompt: problem.prompt, isEquation: !!problem.isEquation,
    userAnswer: rawInput, correctAnswer: problem.answer, isCorrect, assisted: wasAssisted,
    explanation: problem.explanation,
    doubts: (problem.chat||[]).filter(t=>!t.hidden)
  });

  if(problem.type==='choice'){
    document.querySelectorAll('[data-choice]').forEach(btn=>{
      btn.disabled=true;
      const val = btn.getAttribute('data-choice');
      if(val===problem.answer) btn.classList.add('correct');
      else if(val===rawInput) btn.classList.add('wrong');
      else btn.classList.add('dim');
    });
  } else {
    document.getElementById('answer-input').disabled=true;
    document.getElementById('check-btn').disabled=true;
  }
  document.getElementById('help-btn').disabled = true;

  const isLast = sess.idx>=sess.problems.length-1;
  document.getElementById('feedback-slot').innerHTML = `
    <div class="feedback ${isCorrect?(wasAssisted?'assisted':'correct'):'wrong'}">
      ${isCorrect?'✅ Correct!':'❌ Not quite — the answer is '+esc(String(problem.answer))+'.'}
      ${wasAssisted?'<span class="assisted-note">📝 Recorded as assisted, since the concept was explained first.</span>':''}
      <span class="explain">${problem.explanation}</span>
    </div>`;
  document.getElementById('actions-slot').innerHTML = `<button class="btn btn-primary" id="next-btn">${isLast?'Finish session':'Next problem →'}</button>`;
  document.getElementById('next-btn').addEventListener('click', ()=>{
    if(isLast){ clearInterval(sess.timerId); finishSession(); }
    else { sess.idx++; renderSession(); }
  });
}

function finishSession(){
  const sess = state.session;
  if(!sess) return;
  const data = currentData();
  const dayNum = sess.dayNum;
  ensureDay(data, sess.subject, sess.band, dayNum);
  const strandKey = sess.strandKey;
  const alreadyDone = data.days[dayNum][strandKey].done;
  if(!alreadyDone){
    data.days[dayNum][strandKey] = { done:true, score:sess.correct, total:sess.answered, assisted:sess.assisted||0, review:sess.reviewLog };
  } else {
    // Bonus "practice again" rounds keep the original score on record, but still
    // save their own review so the dashboard link works even for older completions
    // recorded before review-logging existed.
    data.days[dayNum][strandKey].review = sess.reviewLog;
  }
  const nowFullyDone = allDone(data.days[dayNum], sess.subject, sess.band);
  if(nowFullyDone && dayNum === (data.currentDay||1)){
    data.currentDay = dayNum+1;
  }
  pruneOldReviews(data, 30);
  saveData(state.profileId, data);
  state.screen='summary';
  state.session.dayNumFinished = dayNum;
  state.session.becameFullyDone = nowFullyDone;
  state.session.newStreak = computeStreak(data, sess.subject, sess.band);
  render();
}
